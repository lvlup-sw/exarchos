name: Fresh Install Smoke

# End-to-end bootstrap smoke for the install script.
#
# Spawns minimal Ubuntu + Alpine docker containers that have nothing
# beyond curl/ca-certificates, runs the real `tools/release/get-exarchos.sh`
# against a pinned release tag, and verifies `exarchos --version` and
# `exarchos mcp` both work from zero-state.
#
# Intentionally NOT on pull_request/push — docker-in-docker is slow and
# flaky under branch-preview load, and the gate here is "did the install
# story regress" which is fine to observe weekly rather than per-PR.
#
# When the release asset is missing, the download step of the bootstrap
# script gets a 404. The test treats that case as a skip with an INFO log,
# not as a failure (see `tests/e2e/fresh-install-bootstrap.test.ts`).
# The default version, v2.9.0, is released, so the `pass` branch asserts.
#
# To re-target the smoke at a specific release (e.g. an rc tag), dispatch
# with the `version` input:
#   gh workflow run fresh-install-smoke.yml -f version=v2.9.0-rc1

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to smoke-test (default v2.9.0)'
        required: false
        default: 'v2.9.0'
        type: string
  schedule:
    # Weekly Monday 04:00 UTC — off-peak for both the release pipeline
    # and any concurrent npm / docker pulls. The value is a single
    # string, not an array, because GitHub Actions does not accept a
    # list for `schedule.cron` entries of one item.
    - cron: '0 4 * * 1'

permissions:
  contents: read
  # Resolves the @lvlup-sw scope from GitHub Packages (see .npmrc).
  packages: read

env:
  # Authenticates the @lvlup-sw scope against GitHub Packages (see .npmrc).
  # Deliberately not NODE_AUTH_TOKEN, which setup-node binds to npmjs.org.
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  smoke:
    name: Fresh install (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'ubuntu:24.04'
          - 'alpine:latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install test dependencies
        # Install the dependencies that run the test file. The smoke tests
        # the bootstrap script, not the build pipeline.
        run: npm ci

      - name: Run fresh-install smoke
        env:
          ENABLE_E2E_SMOKE: '1'
          EXARCHOS_SMOKE_VERSION: ${{ github.event.inputs.version || 'v2.9.0' }}
          DOCKER_IMAGE: ${{ matrix.image }}
        run: npx vitest run tests/e2e/fresh-install-bootstrap.test.ts
