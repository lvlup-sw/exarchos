name: Release

# Tag-triggered release pipeline for the v2.9 install rewrite.
#
# Two parallel publish paths run on every `v*.*.*` tag:
#   1. `release` job      — npm publish of the installer package.
#   2. `binary-matrix` +
#      `publish-release`   — cross-compiled native binaries (5 targets)
#                            + SHA-512 checksum sidecars + an Ed25519-signed
#                            release manifest (DR-20) attached to the
#                            GitHub Release so the bootstrap scripts
#                            (`scripts/get-exarchos.sh` / `.ps1`) can
#                            fetch them by predictable URL.
#
# The broader `v*` trigger remains alongside `v*.*.*` so historical
# non-semver tags keep publishing to npm. The binary pipeline requires
# a semver tag shape to derive the release version.

on:
  push:
    tags:
      - 'v*'
      - 'v*.*.*'

permissions:
  contents: write
  # id-token: write is required by npm's trusted-publishing flow (OIDC).
  # npm CLI 11.5.1+ exchanges the GitHub Actions OIDC token for a short-lived
  # publish credential; no NPM_TOKEN secret needs to be configured. Trusted
  # Publisher must be enrolled on npmjs.com for @lvlup-sw/exarchos pointing
  # at this repo + workflow (lvlup-sw/exarchos / .github/workflows/release.yml).
  id-token: write

jobs:
  release:
    name: Publish Release
    # ubuntu-latest matches binary-matrix below — the self-hosted Azure Container
    # Apps Job runner (caj-github-runner-dev, 4 GiB / 8 GiB ephemeral) reproducibly
    # hangs on a plain `npm ci` for this workload (net RX dies
    # after ~1 GB, CPU drops to near-zero until 1-hour replicaTimeout fires). The
    # same step completes in 30-45s on ubuntu-latest. See memory note
    # feedback_self_hosted_runner_npm_ci_stall.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — this job runs the root `npm run test:run`, which includes
      # the DR-8 legacy-hash manifest test. That test rebuilds the manifest from the
      # historical release-tag trees via `git show`/`git ls-tree`, so it needs the
      # tags AND their objects; a tag-triggered shallow checkout has neither and
      # would red the release before `npm publish`. The manifest's frozen upper
      # bound (MAX_RELEASE_EXCLUSIVE) keeps the just-pushed release tag out of the
      # rebuilt set, so the byte-equality holds.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Route through the shared wrapper for the Playwright browser-download
      # skip + retry/timeout (see docs/rca/2026-05-31-npm-ci-playwright-browser-wedge.md).
      - run: bash "$GITHUB_WORKSPACE/scripts/npm-ci-retry.sh"
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

      - name: Publish to npm
        # Prerelease tags (e.g. v2.9.0-rc.1) must NOT land under the default
        # `latest` dist-tag — that would silently upgrade stable consumers.
        # npm itself refuses such a publish, but we set the right tag rather
        # than relying on the safety net: a SemVer with a `-…` suffix in the
        # tag name routes to the `rc` dist-tag; everything else lands on
        # `latest` as before.
        #
        # Auth flow: npm CLI 11.5.1+ in a workflow with id-token:write detects
        # the GitHub Actions OIDC env and exchanges it for a short-lived publish
        # credential via npm's trusted-publishing endpoint. NODE_AUTH_TOKEN is
        # only consulted if OIDC fails. We keep the env binding as a fallback
        # so legacy tokens still work during the trusted-publisher rollout;
        # remove it once OIDC has shipped one stable release without incident.
        run: |
          npm --version
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            npm publish --access public --tag rc
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────
  # binary-matrix (release)
  # ─────────────────────────────────────────────────────────────────────
  # Cross-compiles the Exarchos CLI + MCP server into a native single-file
  # executable for every TARGET in `scripts/build-binary.ts`, generates a
  # SHA-512 sidecar per binary, and uploads the pair as a workflow
  # artifact that `publish-release` then attaches to the GitHub Release.
  #
  # DRIFT CONTRACT (single source of truth: `TARGETS` in
  # `scripts/build-binary.ts`). Three lists must stay in lock-step:
  #
  #   1. `TARGETS` tuple         — scripts/build-binary.ts (canonical)
  #   2. `matrix.target` here    — release.yml binary-matrix (this job)
  #   3. `matrix.target`         — ci.yml binary-matrix (task 1.5 PR gate)
  #   4. `files:` list           — publish-release step below
  #      (must enumerate each target's binary + .sha512 sidecar, plus the
  #      signed release manifest, keeping the 11-asset count deterministic)
  #
  # Enforcement gates:
  #   - `scripts/release-workflow.test.ts` — this file (list 2 + 4)
  #   - `scripts/ci-binary-matrix.test.ts` — ci.yml + package.json (list 3)
  #   - `scripts/build-binary.test.ts`     — TARGETS shape (list 1)
  # Editing any one without the others will fail `npm run test:run`.
  #
  # The `.sha512` sidecar filename convention — `<binary>.sha512` — is
  # consumed directly by `scripts/get-exarchos.sh` (CHECKSUM_URL) and
  # `scripts/get-exarchos.ps1`. Do not rename without updating both.
  #
  # `fail-fast: false` on the matrix is intentional: a per-target failure
  # should not cancel the other four builds, so you can inspect which
  # platform regressed. The downstream `publish-release` job depends on
  # `binary-matrix` and will not run if any target fails.
  # ─────────────────────────────────────────────────────────────────────
  binary-matrix:
    name: Binary Matrix (${{ matrix.target }})
    # Only run for semver-shaped tags (vN.N.N[-pre]) — historical
    # non-semver `v*` tags continue to drive the npm-only `release` job
    # but must not produce or mutate GitHub Release assets.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with TARGETS in scripts/build-binary.ts.
        target:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          # Both lockfiles must be cache keys — root deps (js-yaml,
          # @inquirer/prompts) are reachable from the MCP build entry via
          # `src/cli-commands/install-skills-bridge.js`
          # → `../../../../src/runtimes/load.js` (added in #1213).
          cache-dependency-path: |
            package-lock.json
            package-lock.json

      - name: Install root dependencies
        # The MCP build entry transitively imports `src/install/runtimes/load.ts`
        # which requires `js-yaml`; without root deps the bun --compile step
        # fails with "Could not resolve: js-yaml". Route through the shared
        # wrapper for the Playwright browser-download skip + retry/timeout
        # (see docs/rca/2026-05-31-npm-ci-playwright-browser-wedge.md).
        run: bash "$GITHUB_WORKSPACE/scripts/npm-ci-retry.sh"

      - name: Build binary for ${{ matrix.target }}
        run: bun run scripts/build-binary.ts --target ${{ matrix.target }}

      - name: Generate SHA-512 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist/bin
          # Find the single artifact for this target. Windows binaries
          # carry a `.exe` suffix; all others have no extension.
          shopt -s nullglob
          candidates=(exarchos-${{ matrix.target }} exarchos-${{ matrix.target }}.exe)
          found=""
          for c in "${candidates[@]}"; do
            if [[ -f "$c" ]]; then
              found="$c"
              break
            fi
          done
          if [[ -z "$found" ]]; then
            echo "::error::no binary produced for target ${{ matrix.target }}"
            exit 1
          fi
          sha512sum "$found" > "${found}.sha512"
          echo "Produced ${found} and ${found}.sha512"

      - name: Upload binary + checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: exarchos-${{ matrix.target }}
          path: |
            dist/bin/exarchos-${{ matrix.target }}
            dist/bin/exarchos-${{ matrix.target }}.exe
            dist/bin/exarchos-${{ matrix.target }}.sha512
            dist/bin/exarchos-${{ matrix.target }}.exe.sha512
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # publish-release
  # ─────────────────────────────────────────────────────────────────────
  # Downloads every per-target artifact produced by `binary-matrix`,
  # builds + SIGNS the DR-20 release manifest over those exact bytes, and
  # attaches the collected 11 assets (5 binaries + 5 sha512 sidecars + the
  # signed manifest) to the GitHub Release associated with the current tag.
  #
  # ── Why the manifest and not just the .sha512 sidecars ───────────────
  # A `.sha512` sidecar is UNSIGNED and self-referential: whoever can swap
  # the binary can swap its sidecar. It only detects a corrupted download.
  # `exarchos-release-manifest.json` is an Ed25519-signed record that also
  # pins WHAT was built — the git commit + source-tree digest and the
  # P03-01 frozen contract-authority digest — which are the same values
  # `scripts/build-binary.ts` stamps into the binaries themselves. That is
  # what lets an installer reject a source, contract, manifest or asset
  # mismatch rather than merely a truncated download.
  #
  # OPERATIONAL PREREQUISITE: the `EXARCHOS_RELEASE_SIGNING_KEY` repository
  # secret must hold a PKCS#8 PEM Ed25519 private key. The manifest step is
  # fail-closed — an absent or empty secret aborts the release rather than
  # publishing an unsigned or partially-verified one.
  # ─────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release assets
    # Same semver guard as binary-matrix — non-semver `v*` tags must not
    # publish GitHub Release artefacts.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.')
    needs: binary-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifest builder is a TypeScript module that imports the
      # `src/install/release/**` primitives, so it needs bun
      # plus that workspace's dependencies (zod) resolvable on disk.
      #
      # SHA-pinned (supply-chain hardening): this job receives
      # `EXARCHOS_RELEASE_SIGNING_KEY`, so a mutable `@v2` tag would let a
      # compromised upstream tag exfiltrate the signing key. Full commit SHA
      # only; bump by resolving the new tag's commit deliberately.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            package-lock.json

      - name: Install dependencies
        run: bash "$GITHUB_WORKSPACE/scripts/npm-ci-retry.sh"

      - name: Download all binary-matrix artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          # One directory per matrix target, flattened below.

      - name: Flatten release-assets into dist/release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          # Each artifact directory is named `exarchos-<os>-<arch>` and
          # contains either a bare binary or a `.exe`, plus its
          # corresponding `.sha512` sidecar.
          shopt -s nullglob
          for dir in release-assets/*/; do
            for f in "${dir}"*; do
              cp "$f" dist/release/
            done
          done
          echo "Collected assets:"
          ls -l dist/release/
          # Invariant: this count is taken BEFORE the signed manifest is
          # generated, so it is still the 10 binary+sidecar assets the
          # matrix produced. If it is ever off, the matrix or the `files:`
          # list drifted from TARGETS.
          expected=10
          actual=$(find dist/release -maxdepth 1 -type f | wc -l)
          if [[ "$actual" -ne "$expected" ]]; then
            echo "::error::expected ${expected} matrix assets (5 binaries + 5 .sha512 sidecars), found ${actual}"
            exit 1
          fi

      - name: Build and sign the release manifest
        # Digests the EXACT bytes that are about to be published (dist/release),
        # embeds the source + contract identity, and signs the whole record with
        # the publisher key. Fail-closed: a missing secret aborts the release.
        #
        # The CLI also prints the working-tree source state. This job runs no
        # codegen, so it must print "clean"; a "::warning::Source state:
        # modified" annotation here means the manifest is describing a checkout
        # that does not match its own commit and the release should be halted.
        env:
          EXARCHOS_RELEASE_SIGNING_KEY: ${{ secrets.EXARCHOS_RELEASE_SIGNING_KEY }}
        run: |
          bun run scripts/build-release-manifest.ts \
            --assets-dir dist/release \
            --out dist/release/exarchos-release-manifest.json \
            --key-id ${{ vars.EXARCHOS_RELEASE_KEY_ID || 'exarchos.release.v1' }} \
            --private-key-env EXARCHOS_RELEASE_SIGNING_KEY

      - name: Verify the manifest covers every published asset
        shell: bash
        run: |
          set -euo pipefail
          # Adversarial shape check: 10 matrix assets + 1 signed manifest.
          expected=11
          actual=$(find dist/release -maxdepth 1 -type f | wc -l)
          if [[ "$actual" -ne "$expected" ]]; then
            echo "::error::expected ${expected} release assets (5 binaries + 5 .sha512 sidecars + 1 signed manifest), found ${actual}"
            exit 1
          fi
          test -s dist/release/exarchos-release-manifest.json

      - name: Publish release assets
        # softprops/action-gh-release v1 is unmaintained and pre-Node-20.
        # v2 is the maintained line built for the current runner image.
        # SHA-pinned (supply-chain hardening): runs in the signing-key job
        # with `contents: write` — a mutable tag is not acceptable here.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          # Release body template — advertises the two bootstrap scripts
          # (`scripts/get-exarchos.sh` / `.ps1`). The trailing auto-
          # generated asset list is produced by GitHub from the `files:`
          # attachments below.
          body: |
            ## Install

            **Unix (macOS / Linux):**
            ```bash
            curl -fsSL https://lvlup-sw.github.io/exarchos/get-exarchos.sh | bash
            ```

            **Windows (PowerShell):**
            ```powershell
            irm https://lvlup-sw.github.io/exarchos/get-exarchos.ps1 | iex
            ```

            ## Assets

            5 cross-compiled binaries with SHA-512 checksums are attached below,
            plus `exarchos-release-manifest.json` — an Ed25519-signed manifest
            pinning the source commit, source-tree digest, frozen contract
            authority and the raw-byte digest of every asset.
          # The 11-asset manifest: 5 binaries + 5 sha512 sidecars + the
          # signed release manifest.
          #
          # Order is {binary, .sha512} per target, targets ordered to
          # match `TARGETS` in `scripts/build-binary.ts`. Windows uses
          # the `.exe` + `.exe.sha512` convention (the extension is
          # preserved in the sidecar name so the bootstrap scripts can
          # derive it by appending `.sha512` to the binary URL).
          #
          # Adversarial shape check: the verify step above counts files
          # in `dist/release/` and aborts if the count diverges from 11,
          # catching drift before `softprops/action-gh-release` uploads a
          # partial release.
          files: |
            dist/release/exarchos-linux-x64
            dist/release/exarchos-linux-x64.sha512
            dist/release/exarchos-linux-arm64
            dist/release/exarchos-linux-arm64.sha512
            dist/release/exarchos-darwin-x64
            dist/release/exarchos-darwin-x64.sha512
            dist/release/exarchos-darwin-arm64
            dist/release/exarchos-darwin-arm64.sha512
            dist/release/exarchos-windows-x64.exe
            dist/release/exarchos-windows-x64.exe.sha512
            dist/release/exarchos-release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
