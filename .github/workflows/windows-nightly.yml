name: Windows Nightly

# Runs the `core` vitest project on windows-latest each night. The same suite runs
# in ci.yml `test-windows` on each push to main and on a PR with the `ci:windows`
# label, but not on every PR. This run catches runner-image drift on days with no
# merge. Keep the setup below in step with `test-windows` in ci.yml.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Resolves the @lvlup-sw scope from GitHub Packages (see .npmrc).
  packages: read

env:
  # Authenticates the @lvlup-sw scope against GitHub Packages (see .npmrc).
  # Deliberately not NODE_AUTH_TOKEN, which setup-node binds to npmjs.org.
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  core:
    name: Windows Core (nightly)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      EXARCHOS_PREFLIGHT_DEBUG: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Allow the Node 22 win32 better-sqlite3 prebuild. A source rebuild cannot
      # succeed without a C++ toolchain on this runner.
      npm_config_build_from_source: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          # Node 24 + better-sqlite3 aborts the vitest worker on isolate teardown.
          # Node 22 does not.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      - run: npm run test:core
