name: Eval Gate

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'commands/**'
      - 'rules/**'
      - 'evals/**'
      - 'servers/exarchos-mcp/src/workflow/playbooks.ts'
      - 'servers/exarchos-mcp/src/cli-commands/**'
      - 'servers/exarchos-mcp/src/verbs/team/prepare-delegation.ts'
      - 'servers/exarchos-mcp/src/evals/**'
      # Opt-in eval package (DR-3): owns the promptfoo dep the graders
      # dynamic-import. A change here must re-run the eval gate.
      - 'servers/exarchos-mcp/evals-pkg/**'
      - '.github/workflows/eval-gate.yml'

# Build native modules from source rather than fetching prebuilt binaries from
# GitHub Releases via `prebuild-install`, whose CDN fetch wedged `npm ci` on the
# hosted runners until the 15-minute job timeout (see RCA
# docs/rca/2026-05-30-state-source-integrity.md). ~48s for better-sqlite3, but
# no dependency on that download path.
env:
  npm_config_build_from_source: 'true'

jobs:
  eval-regression:
    name: Eval Regression Check
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: eval-gate-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            servers/exarchos-mcp/package-lock.json
            servers/exarchos-mcp/evals-pkg/package-lock.json

      # Bun is required to run `dist/evals/run-evals-cli.js` because the eval
      # runner's import graph reaches `storage/sqlite-backend.ts`, which uses
      # `import { Database } from 'bun:sqlite'`. Node 24's ESM loader rejects
      # the `bun:` URL scheme; bun resolves it natively.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Default MCP-server deps only — promptfoo is NO LONGER here (DR-3); it
      # lives in the opt-in eval package installed below. Retry-with-timeout so
      # a transient registry/CDN stall doesn't hang to the job timeout (RCA
      # 2026-05-30-state-source-integrity).
      - name: Install Dependencies
        working-directory: servers/exarchos-mcp
        run: bash "$GITHUB_WORKSPACE/scripts/npm-ci-retry.sh"

      # Build the server (incl. the eval runner + graders) BEFORE installing the
      # eval package — the ambient promptfoo shim keeps `tsc` green here without
      # promptfoo, and building first guarantees the server typecheck never sees
      # the real package.
      - name: Build
        working-directory: servers/exarchos-mcp
        run: npm run build

      # The eval gate is the one job that genuinely needs `promptfoo` (the
      # graders dynamic-import it). It ships only with this opt-in eval package
      # (DR-3), so install it here — promptfoo lands in evals-pkg/node_modules,
      # from which the graders' loader (promptfoo-loader.ts) resolves it at
      # runtime.
      - name: Install eval package (promptfoo)
        working-directory: servers/exarchos-mcp/evals-pkg
        run: bash "$GITHUB_WORKSPACE/scripts/npm-ci-retry.sh"

      # DR-14: enforce the strict-flag ratchet on the eval workspace itself.
      # promptfoo is installed above, so evals-pkg tsc resolves it under the
      # noUncheckedIndexedAccess + exactOptionalPropertyTypes flags this
      # workspace now carries (the ambient shim is server-tree-only and does
      # not reach evals-pkg/src). This is the continuous "every typecheck
      # green" enforcement the flag-presence guard test cannot provide.
      - name: Typecheck eval package (DR-14 strict flags)
        working-directory: servers/exarchos-mcp/evals-pkg
        run: npm run typecheck

      - name: Run Regression Evals
        working-directory: servers/exarchos-mcp
        run: |
          echo '{"ci": true, "layer": "regression"}' | bun dist/evals/run-evals-cli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVALS_DIR: ../../evals

      - name: Run Capability Evals (advisory)
        working-directory: servers/exarchos-mcp
        continue-on-error: true
        run: |
          echo '{"ci": true, "layer": "capability"}' | bun dist/evals/run-evals-cli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVALS_DIR: ../../evals
