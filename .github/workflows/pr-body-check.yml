name: PR Body Check

on:
  pull_request:
    # `synchronize` is required. The golden-fixture gate below reads the PR's
    # changed files, so it must run again when a push adds a load-bearing
    # fixture after the PR opens. The enforcer-wiring gate asserts this trigger.
    types: [opened, edited, synchronize, ready_for_review, reopened]

# A newer event on the same PR cancels the check for the earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-body:
    if: |
      (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request') &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.title, '[Graphite MQ]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup GitHub CLI
        env:
          GH_VERSION: '2.65.0'
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
              | tar xz -C /tmp
            echo "/tmp/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          fi

      # The org action checks the body against the org template: the five
      # headings in order, no other heading, no template hint, no footer and
      # at most 250 words. Both local templates must stay copies of it.
      # Move this pin to the org release tag that ships actions/pr-body.
      - name: Validate PR body
        uses: lvlup-sw/.github/actions/pr-body@eff7fa80b8595be0bf5f6a74aab7f750bab99819 # lvlup-sw/.github#48
        with:
          same-as: |
            .github/PULL_REQUEST_TEMPLATE.md
            .exarchos/pr-template.md

      # If the PR changes a file under tests/core/fixtures/load-bearing/, the PR
      # body must carry a `GOLDEN-FIXTURE-UPDATE: <reason>` line. The check lives
      # here, not in ci.yml, because it needs the PR body. This job installs no
      # packages, so the script must import only Node built-ins.
      - name: Golden-fixture marker check (DR-15)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          gh pr view "$PR" --json body -q .body > "$RUNNER_TEMP/pr-body.txt"
          # Use the paginated "list PR files" API, not `gh pr diff` — the .diff
          # endpoint caps at 300 files and 406s on large PRs (e.g. the debloat
          # wave itself), which would fail this gate closed on scale. The files
          # API paginates (100/page) and returns the same newline-separated list.
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/pr-changed.txt"
          node tools/audit/gates/check-golden-fixture-note.mjs \
            --body-file "$RUNNER_TEMP/pr-body.txt" \
            --changed-files-file "$RUNNER_TEMP/pr-changed.txt"
