name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  # Resolves the @lvlup-sw scope from GitHub Packages (see .npmrc). The repo
  # default grants this, but an explicit block replaces the default rather than
  # extending it, so omitting it here would leave `npm ci` at packages: none.
  packages: read

# Build native modules (better-sqlite3, bufferutil, utf-8-validate) from source
# instead of downloading prebuilt binaries via `prebuild-install`. Those
# prebuilds come from GitHub Releases (objects.githubusercontent.com), whose
# fetch wedged on the hosted runners — `npm ci` hung silently after the
# `prebuild-install` warning until the job timeout, on every retry. Source
# builds use only the tarball already in the npm cache + the runner's toolchain
# (~48s for better-sqlite3), so the install no longer depends on that CDN.
# No-op for pure-JS deps, for the root install (no gyp natives), and for the
# `--omit=dev` binary-matrix jobs. See RCA docs/rca/2026-05-30-state-source-integrity.md.
env:
  npm_config_build_from_source: 'true'
  # Authenticates the @lvlup-sw scope against GitHub Packages (see .npmrc).
  # Deliberately not NODE_AUTH_TOKEN, which setup-node binds to npmjs.org.
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Gate hosting taxonomy: each job and gate below lives in exactly one of four host
  # classes (zero-dep prefix unfiltered, deps-tail unfiltered, deps-unfiltered
  # suite-shaped, deps-filtered). docs/guides/ci-gate-hosting.md holds the decision
  # table, the two-surface subset rule and the non-blocking allowlist contract
  # (tests/scripts/ci-topology.test.ts). Cite it at the wiring site of a gate, and do
  # not restate it here. `pr-body-check.yml` is a separate workflow, outside the
  # contract of this aggregator.
  # ─────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: plan
        uses: lvlup-sw/.github/actions/ci-lanes@v1

  # Untargeted contract check: prove the manifest and this workflow still agree.
  # Not in CI Gate (the gate may only cover jobs that need `plan`).
  lanes-check:
    name: CI Lanes Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lvlup-sw/.github/actions/ci-lanes@v1
        with:
          mode: check

  test-root:
    name: Root Package
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).root != 'false') }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the legacy-hash manifest test
      # (tests/scripts/generate-legacy-skill-hashes.test.ts, in the root unit suite)
      # derives render hashes from release tags with `git show <tag>:<path>`. A shallow
      # checkout has no tags, so `enumerateReleaseRefs()` returns [] and the suite fails.
      # Full history brings the tags and their tree objects.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      # Both installer shells must be present. `tests/scripts/installer-verify.test.ts`
      # drives get-exarchos.sh under bash and get-exarchos.ps1 under pwsh; each
      # absent shell silently dropped 11 tests while the run still reported
      # success. This lane owns that suite, so it owns the prerequisite.
      # PowerShell ships on the ubuntu-latest runner image — installing it here
      # would be redundant, but asserting it is not: an image change that drops
      # pwsh must fail here with a legible message rather than reappear as a
      # suite that quietly halves. The suite's own
      # `InstallerVerify_ShellAbsent_FailsClosedRatherThanSkipping` is the
      # backstop; this step just fails earlier and more clearly.
      - name: Guard — both installer shells present
        run: |
          missing=()
          command -v bash >/dev/null 2>&1 || missing+=("bash")
          command -v pwsh >/dev/null 2>&1 || command -v powershell >/dev/null 2>&1 || missing+=("pwsh")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::${missing[*]} unavailable on this lane — the installer acceptance suite would SKIP every test of each missing shell and still report success. Install it (ubuntu: https://learn.microsoft.com/powershell/scripting/install/install-ubuntu) rather than widening the waiver."
            exit 1
          fi
          echo "installer shells present: bash=$(command -v bash) pwsh=$(command -v pwsh || command -v powershell)"

      - run: npm run typecheck

      - run: npm run test:run

      # The extracted conformance suite (task 018a). `npm run test:run` is the
      # `unit` project ONLY, so the `conformance` project needs its own step or
      # it is collected by nothing — the silent-green shape this suite exists to
      # catch, applied to the suite itself. This is the WHOLESALE host, the role
      # `test-mcp` filled before the extraction; the five Wave-1 guards keep
      # their individually-named UNFILTERED hosts on `grep-gates`.
      - run: npm run test:conformance

      # End-to-end install acceptance. It has its own step for the same reason as
      # conformance above: `npm run test:run` runs the `unit` project only.
      #
      # It copies the TRACKED content of HEAD into a scratch directory and runs the real
      # installer over it. Only this view shows a gitignored payload, an unflattened
      # skill tree, or a hook registered twice. Every other check reads the working
      # tree, where an untracked file resolves exactly like a shipped one.
      - run: npm run test:acceptance

      # render:guard — the single drift gate over everything the build
      # generates. Re-renders content/ and fails if any generated tree differs
      # from what is committed: the rendered/ artifact trees (skills, commands,
      # rules, agents, command-aliases), the plugin-root hooks/ and binding/
      # output, the per-harness agent dot-directories, and the embedded runtime
      # module codegen'd from content/harness/runtimes/*.yaml.
      #
      # It replaces skills:guard, hooks:guard and runtimes:guard, which each
      # covered one slice. Consolidating them also lets the guard assert its own
      # liveness: every declared scope must resolve to a non-empty tree, so a
      # guard that has stopped watching fails instead of reporting one confident
      # success. Depends on dist/install/render-guard.js from the earlier
      # `npm ci` (`prepare` -> `tsc`).
      - run: npm run render:guard

      # desc:budget-guard — MCP description token-budget gate (#1321, R-E).
      # Tool/action descriptions cost every agent on every `tools/list` call;
      # this asserts each composite-tool / slim / per-action description stays
      # under a documented token budget (chars/4 estimate) and fails CI on
      # overrun with a per-offender breakdown. Runs here (not grep-gates)
      # because it imports TOOL_REGISTRY via tsx, which needs both the root
      # and MCP-server deps this job already installs. Sibling to skills:guard
      # / lint:invariants. Blocking via the ci-gate aggregator (test-root).
      - run: npm run desc:budget-guard

  test-mcp:
    name: Exarchos MCP Server
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).mcp != 'false') }}
    runs-on: ubuntu-latest
    env:
      RUN_EVALS: '1'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — the mutation gate (check-mutation-gate.mjs) diffs
          # `<base>...HEAD` (merge-base, three-dot) to scope the changed `src`. A
          # shallow checkout lacks the merge-base commit, so the diff fails with
          # "no merge base" (fail-closed).
          fetch-depth: 0
          # The mutation gate only reads history, and this job then runs
          # repo/dependency code (test runners, bun build, npm postinstalls), so
          # don't persist the checkout token into .git/config for those steps.
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          # Node 24 tears down a vitest fork isolate before better-sqlite3
          # can unregister its environment cleanup hook, aborting the worker
          # (`Assertion failed: (env) != nullptr`) and starving coverage.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # `compiled-binary-mcp.test.ts` shells out to
      # `bun run tools/release/build-binary.ts` from the repo root — bun must
      # be on PATH or the spawn fails with `exit null`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # One install: the product is one package, so the core and the installer share
      # one dependency closure.
      - name: Install dependencies
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      - run: npx tsc --noEmit

      # Coverage baseline: this step is the suite run and the coverage run in ONE
      # execution. A second full run doubles the wall time and the exposure to the known
      # flaky E2E and perf tests. The step env pins RUN_EVALS off over the job-level
      # value, so the measured lane does not depend on RUN_EVALS. The eval lane has its
      # own conditional step below. Host class: deps, filtered on `mcp`. The scan surface
      # src/** is inside the mcp filter, and a grep-gates .test.sh step re-asserts the
      # ratchet script unfiltered. See docs/guides/ci-gate-hosting.md.
      - name: Coverage-instrumented suite (DR-5, RUN_EVALS pinned off)
        env:
          RUN_EVALS: ''
        run: npm run test:coverage

      # Coverage non-regression ratchet, BLOCKING. It compares the run with the floored
      # baseline in tools/audit/coverage-baseline.json, and a regression beyond the
      # floored epsilon fails this job. The path is $GITHUB_WORKSPACE-absolute, because
      # the script resolves its inputs from its own location, not the cwd.
      # Host class: deps, filtered on `mcp`. See docs/guides/ci-gate-hosting.md.
      # `if: !cancelled()` (not the implicit `success()`): the ratchet result is evidence
      # even when the coverage suite above fails. vitest writes coverage-summary.json on
      # failure too (reportOnFailure). A red suite still fails the job on its own step,
      # and the ratchet can only add a reason.
      - name: Coverage ratchet — blocking (DR-5)
        if: ${{ !cancelled() }}
        run: node "$GITHUB_WORKSPACE/tools/audit/gates/check-coverage-ratchet.mjs"

      # Publish the coverage summary as a run artifact, so a baseline refresh can read
      # the live totals of CI runs. `path` is workspace-relative, because upload-artifact
      # ignores the run default-directory of the job.
      - name: Upload coverage summary (DR-5)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

      # Eval lane: it runs the RUN_EVALS-gated eval tests (evals/harness.test.ts,
      # evals/graders/llm-rubric.test.ts) with RUN_EVALS=1, outside the coverage
      # instrument. No other CI step runs these tests with RUN_EVALS set. The prompts
      # paths are in the `mcp` lane, so this job is the eval host and the step runs
      # each time the job runs. A targeted job can read only one lane, so the step has
      # no second prompts predicate. Host class: deps, filtered on `mcp`.
      # See docs/guides/ci-gate-hosting.md.
      - name: Eval lane (RUN_EVALS-gated) (DR-5)
        # `!cancelled()`: the eval lane is the evidence surface for the RUN_EVALS-gated
        # tests, so a red coverage suite above must not skip it.
        if: ${{ !cancelled() }}
        env:
          RUN_EVALS: '1'
        run: npx vitest run tools/evals/evals/harness.test.ts tools/evals/evals/graders/llm-rubric.test.ts

      # Diff-scoped mutation gate, OBSERVE MODE, on pull_request events only (a push to
      # main has no PR base to diff). The script fetches the shallow PR base ref
      # (origin/$GITHUB_BASE_REF) and runs the in-tree mutation-adequacy handler with
      # bun (set up above). An empty diff is a logged skip, and a git failure is
      # fail-closed. Observe mode logs the verdict and always exits 0. The step stays in
      # observe mode until #1720 resolves: the StrykerJS dry-run fails on the full suite
      # in CI. Host class: deps, filtered on `mcp`. A grep-gates step re-asserts the
      # script unfiltered. See docs/guides/ci-gate-hosting.md.
      - name: Mutation gate — observe mode (DR-7), PR events only
        if: github.event_name == 'pull_request'
        run: node "$GITHUB_WORKSPACE/tools/audit/gates/check-mutation-gate.mjs" --observe

      # Composed-path Stryker smoke test: resolver, handler, adapter, the real pinned
      # Stryker and the parser, on a small fixture scope. It runs in its OWN step,
      # outside the coverage instrument and outside the default suite glob (excluded in
      # vitest.config.ts). This keeps it out of the coverage numbers and out of the
      # Windows lane, which has a known spawn flake. EXARCHOS_SMOKE_ONLY=1 lifts that
      # exclusion for this one run, because the vitest CLI --exclude is additive and
      # cannot remove an exclusion.
      # test-mcp runs on ubuntu-latest, so this test is Linux-only.
      # Host class: deps, filtered on `mcp`. See docs/guides/ci-gate-hosting.md.
      - name: Composed-path Stryker smoke test (DR-7, task 012) — Linux-only
        env:
          EXARCHOS_SMOKE_ONLY: '1'
        run: npx vitest run tests/unit/verbs/stryker-adapter.smoke.test.ts

      # cli:vocab-guard (#1317) — mechanical gate against CLI vocabulary drift
      # (R-A / Principle 6). Walks the rendered Commander surface via `buildCli`
      # and fails on a banned verb (`info`, `ls`, `rm`) or banned flag alias
      # (`--format` as a JSON carrier, `--skip-confirmation*`). Runs here rather
      # than in grep-gates because resolving `buildCli` pulls in `bun:sqlite`,
      # which needs Bun (already set up above) + the MCP deps installed in this
      # job. Flows into the required `ci-gate` check via test-mcp.
      - run: npm run cli:vocab-guard

  # ─────────────────────────────────────────────────────────────────────
  # test-windows (#1170)
  # ─────────────────────────────────────────────────────────────────────
  # Runs the `core` vitest project (`npm run test:core`) on a real windows-latest
  # host, for two reasons:
  #   1. Linux-only tests miss Windows bugs (path separators, the ancestry preflight).
  #   2. `EXARCHOS_PREFLIGHT_DEBUG=1` makes the ancestry preflight emit its structured
  #      `merge.preflight` debug payload on a real Windows host. It is harmless on
  #      green runs.
  #
  # `shell: bash` is set per step for the *.sh helpers (Git Bash ships on
  # windows-latest). npm and npx steps use the default shell. The bun setup mirrors
  # test-mcp, so the compiled-binary tests can resolve their bundler.
  # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD avoids the npm-ci chromium wedge (#1502).
  # ─────────────────────────────────────────────────────────────────────
  test-windows:
    name: Windows Unit (MCP)
    needs: plan
    # Push / non-PR events already run every lane; the skip is byte-exact.
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).mcp != 'false') }}
    runs-on: windows-latest
    env:
      EXARCHOS_PREFLIGHT_DEBUG: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Allow the Node 22 win32 better-sqlite3 prebuild. The workflow default
      # forces a source rebuild, which cannot succeed without a C++ toolchain.
      npm_config_build_from_source: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          # Node 24 + better-sqlite3 aborts the vitest worker on isolate
          # teardown (`Assertion failed: (env) != nullptr`). Node 22 does not.
          # better-sqlite3 12.x ships a win32-x64 Node 22 prebuild (N-API 127).
          # The workflow-level `npm_config_build_from_source=true` would ignore
          # that prebuild and fail node-gyp (this runner has no VS C++
          # workload), so this job turns source builds off below.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      - run: npx tsc --noEmit
      - run: npm run test:core

      # Zero-count guard for the worktree suite (WLM #1576). `npm run test:core` above
      # already runs the worktree tests on this host. This step fails the job when a
      # path-filter or matrix regression drops them, so a lane that ran zero tests
      # cannot satisfy the Windows-CI requirement.
      - name: Guard — worktree suite executed on Windows (DR-11s)
        shell: bash
        run: |
          npx vitest run --project core tests/unit/verbs/worktree/ --reporter=json --outputFile=.wlm-win-guard.json
          count=$(node -e "const r=require('./.wlm-win-guard.json');process.stdout.write(String((r.numPassedTests||0)+(r.numFailedTests||0)))")
          echo "worktree tests executed on windows-latest: $count"
          if [ "$count" -eq 0 ]; then
            echo '::error::worktree suite ran 0 tests on windows-latest — DR-11s guard (a path-filter/matrix regression dropped the suite)'
            exit 1
          fi

      # The named win32-fragile launcher tests (harness-launcher #1603).
      # `npm run test:core` above already runs them on this host. Running them again by
      # name pins the contract that the Windows lane gates the async spawn shim
      # resolution (tests/unit/utils/process.spawn.test.ts) and the worktree path
      # derivation and containment (tests/unit/runtime/launcher/topology.test.ts). If a
      # path-filter or matrix regression drops either file, this step fails instead of
      # passing on zero tests.
      #
      # NOTE: a REQUIRED branch-protection check for test-windows is a manual
      # repo-settings step (Settings → Branches → main → required status checks), out of
      # the repo and not testable with vitest. test-windows already flows into the
      # blocking ci-gate aggregator below.
      - name: DR-8 — named win32-fragile launcher tests (spawn 003 + path 009)
        shell: bash
        run: |
          npx vitest run --project core tests/unit/utils/process.spawn.test.ts tests/unit/runtime/launcher/topology.test.ts --reporter=json --outputFile=.launcher-win-guard.json
          count=$(node -e "const r=require('./.launcher-win-guard.json');process.stdout.write(String((r.numPassedTests||0)+(r.numFailedTests||0)))")
          echo "win32-fragile launcher tests executed on windows-latest: $count"
          if [ "$count" -eq 0 ]; then
            echo '::error::named win32-fragile launcher tests ran 0 tests on windows-latest — DR-8 guard (a path-filter/matrix regression dropped tests/unit/utils/process.spawn.test.ts or tests/unit/runtime/launcher/topology.test.ts)'
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # test-windows-root
  # ─────────────────────────────────────────────────────────────────────
  # Runs the root `unit` suite (`npm run test:run`) on a real windows-latest host. The
  # sibling `test-windows` lane covers only the `core` project, so this lane catches
  # root-side path and OS regressions.
  #
  # Lane `root` gates it, the same path set as the Linux `test-root` lane. It feeds
  # the blocking `ci-gate` aggregator below.
  #
  # Install prerequisites mirror `test-root`. The root `unit` project includes
  # `tests/scripts/build-binary.test.ts`, which runs `bun build --compile`, so bun and
  # the runtime deps must be present. `shell: bash` is set on the *.sh install steps
  # (Git Bash ships on windows-latest). npm steps use the default shell.
  # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD avoids the npm-ci chromium wedge (#1502).
  #
  # NOTE: a REQUIRED branch-protection check for this job is a manual repo-settings
  # step (Settings → Branches → main → required status checks), out of the repo and
  # not testable in YAML.
  # ─────────────────────────────────────────────────────────────────────
  test-windows-root:
    name: Windows Unit (Root)
    needs: plan
    # Push / non-PR events already run every lane (#1699 baseline is the
    # default-branch push). The skip is byte-exact.
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).root != 'false') }}
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      # fetch-depth: 0 — this lane also runs the root unit suite, which includes the
      # legacy-hash manifest test. That test reads release-tag trees with `git show`, so
      # a shallow checkout without tags fails it (see test-root above).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install root dependencies
        shell: bash
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      # The MCP server's deps must be present so `bun build --compile` can
      # resolve `pino`, `commander`, `@modelcontextprotocol/sdk`, `zod`, and
      # `yaml` when bundling `src/index.ts` (exercised by
      # `tests/scripts/build-binary.test.ts`, part of the root `unit` project run by
      # `npm run test:run`).
      - run: npm run test:run

  # ─────────────────────────────────────────────────────────────────────
  # binary-matrix
  # ─────────────────────────────────────────────────────────────────────
  # Cross-compiles the Exarchos CLI and MCP server into one native binary per OS/arch
  # pair, with `bun build --compile --target=<bun-target>` from
  # `tools/release/build-binary.ts`.
  #
  # DRIFT CONTRACT:
  #   - The `matrix.target` list below MUST match the `os-arch` names derived from
  #     `TARGETS` in `tools/release/build-binary.ts`.
  #   - `tests/scripts/ci-binary-matrix.test.ts` enforces the match. If one side
  #     changes without the other, that test fails `npm run test:run`.
  #   - The script rejects an unknown `--target <name>` value with an error that
  #     lists the valid names, so a typo fails fast inside the runner.
  #
  # Releases: this job uploads per-target workflow artifacts only.
  # `.github/workflows/release.yml` owns GitHub Release publishing and the SHA-512
  # checksums.
  #
  # DISPOSITION: NON-BLOCKING. The job is not in `ci-gate.needs`, and the non-blocking
  # allowlist in `tests/scripts/ci-topology.test.ts` records it with this rationale:
  # it is release-lane compile evidence, not a per-PR gate. The reason is
  # architectural, not reliability. Over 60 completed `ci.yml` runs (2026-07-17),
  # 300 of 300 per-target job instances passed.
  # Host class: deps, unfiltered, suite-shaped. See docs/guides/ci-gate-hosting.md.
  # ─────────────────────────────────────────────────────────────────────
  binary-matrix:
    name: Binary Matrix (${{ matrix.target }})
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with TARGETS in tools/release/build-binary.ts.
        target:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # CodeRabbit/CI #1213: install root deps so `bun build --compile`
      # can resolve modules imported via the cross-tree bridge — e.g.
      # `js-yaml` (from `src/install/runtimes/load.ts`) and `@inquirer/prompts`
      # (from `src/install/install-skills.ts`) which the MCP entry point reaches
      # transitively. Both are declared in root `package.json` but were
      # absent on the runner because only the nested workspace had a
      # `npm ci`. The bundler then errored with "Could not resolve
      # 'js-yaml'" / "Could not resolve '@inquirer/prompts'".
      - name: Install root dependencies
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      # Install MCP-server *runtime* deps so `bun build --compile` can resolve
      # `pino`, `commander`, `@modelcontextprotocol/sdk`, `zod`, and `yaml`
      # when bundling `src/index.ts`. `--omit=dev` skips
      # the heavy dev-only tree (notably `promptfoo`, an eval-only library, and
      # `better-sqlite3`, used only by the Node test shim) — the compiled binary
      # embeds `bun:sqlite`, so none of it is needed here. Big install-time win
      # + far less exposure to the npm-ci stall (RCA 2026-05-30-state-source-integrity).
      - name: Build binary for ${{ matrix.target }}
        run: bun run tools/release/build-binary.ts --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: exarchos-${{ matrix.target }}
          path: dist/bin/exarchos-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # validate-no-legacy
  # ─────────────────────────────────────────────────────────────────────
  # Runs tools/audit/gates/validate-no-legacy.sh, which rolls up two checks:
  #   1. The NoLegacy_* shell assertion suite (tests/scripts/validate-no-legacy.test.sh)
  #      — pins obsolete v2.8 install artifacts as deleted/archived.
  #   2. `knip` (files + dependencies + exports + types) via the allowlist-diff
  #      wrapper (tools/audit/knip-diff.ts) — detects unused modules, deps,
  #      exported symbols, and types, diffed against
  #      tools/audit/knip-allowlist.json (fails closed on unallowlisted or
  #      expired findings, a missing binary, or unparseable output).
  #
  # Runs in parallel with test-root / test-mcp on a GitHub-hosted
  # ubuntu-latest runner. All CI jobs run on ubuntu-latest — the
  # self-hosted runners were retired after their npm ci step intermittently
  # stalled (network RX dies mid-install), whereas the same install completes
  # in 30-45s on hosted runners.
  # ─────────────────────────────────────────────────────────────────────
  validate-no-legacy:
    name: Validate No Legacy
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).always != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root)
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      # The exports and types sweep resolves TypeScript across the workspaces that
      # knip.json declares. The product is one package, so the install above is the
      # whole closure.
      - name: Run validate-no-legacy rollup
        run: bash tools/audit/gates/validate-no-legacy.sh

  # ─────────────────────────────────────────────────────────────────────
  # manifest-gate
  # ─────────────────────────────────────────────────────────────────────
  # Proves that a consolidation PR loses no pre-image test case. It rebuilds BOTH
  # pre-images (the legacy __tests__ copy and the co-located canonical copy) from the
  # merge-base of the PR with `git show <merge-base>:<path>` (hence `fetch-depth: 0`).
  # Each case must survive into the PR-HEAD result (the merged file or a relocated
  # <base>.legacy.test.ts sibling) verbatim modulo import-path rewrites, or as a
  # textual duplicate, in BOTH directions. Equivalence is TEXTUAL only. A divergent
  # vi.mock, vi.hoisted or env preamble forces a relocation, never a silent drop. The
  # gate is inert on PRs that touch no consolidation pair.
  # The job is in `ci-gate.needs` below, so it is REQUIRED. A job that is in ci.yml but
  # not in the aggregator fails OPEN.
  # Host class: deps-tail, unfiltered. See docs/guides/ci-gate-hosting.md.
  # ─────────────────────────────────────────────────────────────────────
  manifest-gate:
    name: Manifest Gate (textual case-preservation)
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).always != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate rebuilds pre-images from the merge-base with `git show`, so it
          # needs the full history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      # The gate imports consolidate-suite.mjs, which pulls in `typescript` (a
      # ROOT devDependency) for TS-compiler-API case extraction. Only the root
      # install is needed — no MCP-server deps, no native build.
      - name: Install dependencies (root)
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      - name: Manifest gate — no pre-image case dropped (DR-2, Task 004)
        # Reconstruct against the PR's actual base branch (not a hardcoded
        # origin/main) so a stacked PR onto a non-main base verifies against the
        # right merge-base; on push events base_ref is empty and the tool
        # defaults to origin/main.
        run: node tools/audit/manifest-gate-ci.mjs ${{ github.base_ref && format('--base origin/{0}', github.base_ref) || '' }}

  # ─────────────────────────────────────────────────────────────────────
  # grep-gates
  # ─────────────────────────────────────────────────────────────────────
  # Structural checks that enforce architectural invariants. The first steps scan src
  # with no install and no build:
  #
  #   1. `withSession({...})` calls in production code must include `operationId` or
  #      `allowNonIdempotent: true` (#1342 P1.D).
  #   2. The literal `BEGIN IMMEDIATE` can appear only inside the SQLite substrate
  #      (`storage/`, `event-store/`). Use in application code is a layering
  #      violation (#1342 P1.E).
  #   3. Event-sourcing read-path gates: the upcast choke point (#1556), no raw
  #      `.state.json` IO (#1504), one canonical workflow-state fold (#1554), and
  #      event-store access only through the composition root.
  #
  # The #1342 gates are pure bash and grep. The read-path gates are pure node
  # (built-ins only). Later steps install the dependencies for the tsx-backed gates.
  # The `ci-gate` aggregator below makes this job blocking.
  # ─────────────────────────────────────────────────────────────────────
  grep-gates:
    name: Grep Gates (idempotency + substrate)
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).always != 'false') }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: withSession idempotency contract (#1342 P1.D)
        run: bash tools/audit/gates/check-withsession-idempotency.sh src

      # Self-test for the gate above. It exercises the gate's own matching logic
      # against seeded fixtures in a tmpdir — it says nothing about production
      # code. Paths resolve from the script's own location, not the cwd.
      - name: withSession idempotency gate self-test (#1342 P1.D)
        run: bash tests/scripts/check-withsession-idempotency.test.sh

      - name: BEGIN IMMEDIATE substrate-only (#1342 P1.E)
        run: bash tools/audit/gates/check-begin-immediate-substrate.sh src

      # Self-test for the gate above. Seeded-fixture cases plus RealTree_* cases
      # that scan this checkout to catch false positives on the legitimate
      # in-substrate `.immediate()` call site.
      - name: BEGIN IMMEDIATE substrate gate self-test (#1342 P1.E)
        run: bash tests/scripts/check-begin-immediate-substrate.test.sh

      # Event-sourcing read-path structural gates. Each is a zero-dependency node script
      # that scans src for an architectural violation and exits non-zero on a regression.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Upcast choke-point — migrateEvents at the read seam (#1556)
        run: node tools/audit/gates/check-query-upcast-choke-point.mjs

      - name: No raw .state.json read/write in production (#1504)
        run: node tools/audit/gates/check-no-state-json.mjs

      - name: Single workflow-state fold — one canonical reducer (#1554)
        run: node tools/audit/gates/check-single-workflow-fold.mjs

      - name: Event-store access via composition root (#1342)
        run: node tools/audit/gates/check-event-store-composition-root.mjs

      - name: Windows-portability anti-patterns (#1623)
        run: node tools/audit/gates/check-windows-portability.mjs

      - name: Windows-portability gate self-test (#1623)
        run: bash tests/scripts/check-windows-portability.test.sh

      - name: WLM wiring gate — DR-1 retry adapter + DR-2 skills reroute (task-004)
        run: node tools/audit/gates/check-wlm-wiring.mjs

      - name: WLM wiring gate self-test (task-004)
        run: bash tests/scripts/check-wlm-wiring.test.sh

      # Proof-substrate ownership census. Exact typed dispositions reject new direct gate
      # emitters, provider registrations, and custom-shell transition guards, and keep
      # the audited v3.0 migration reserve.
      - name: Gate-runner ownership census (v2.12 DR-5)
        run: node tools/audit/gates/check-gate-runner-ownership.mjs

      - name: Gate-runner ownership census self-test (v2.12 DR-5)
        run: bash tests/scripts/check-gate-runner-ownership.test.sh

      # Zero-dependency register and node-only re-asserts. They use the node set up above
      # with no install, on the UNFILTERED host, so they fire on every PR.
      # See docs/guides/ci-gate-hosting.md.

      # Type-debt register: a per-file `as unknown as` count budget, compared with
      # tools/audit/gates/type-debt-baseline.json. It is BLOCKING. It scans the whole src
      # tree, not a PR diff. Host class: zero-dep prefix, unfiltered.
      - name: Type-debt count-budget register (DR-9)
        run: node tools/audit/gates/check-type-debt.mjs

      # Self-test re-asserts: a check script's self-test runs on every PR, unfiltered.
      # These two are zero-dep node. The bun-dependent check-mutation-gate.test.sh
      # re-assert is in the tsx tail below, after the install and a bun setup.
      - name: check-type-debt self-test re-assert (DR-10)
        run: bash tests/scripts/check-type-debt.test.sh
      - name: check-coverage-ratchet self-test re-assert (DR-10)
        run: bash tests/scripts/check-coverage-ratchet.test.sh

      # Enforcer-wiring gate. A zero-dependency node script that reconciles each
      # check-* and lint-* primary with tools/audit/gates/enforcer-wiring-manifest.json.
      # It walks npm-script chains and workflow run steps transitively and inspects the
      # exit-code handling of each term. It catches four trap classes that a name grep
      # cannot see: orphan, unreachable through an uninvoked npm script, exit code
      # swallowed (`|| true` or continue-on-error), and a diff-dependent gate without
      # `synchronize`. It runs on this unfiltered host, because a gate in a path-filtered
      # job is skipped-as-passed. Self-tests: the `EnforcerWiring_*` cases in
      # tests/scripts/check-enforcer-wiring.test.ts, in the root unit suite (test-root).
      - name: Enforcer wiring gate (DR-5/DR-8, task 011)
        run: node tools/audit/gates/check-enforcer-wiring.mjs

      # Fail-closed self-test. The `.test.ts` of the gate runs only in the jobs filtered
      # on `root`. This `.test.sh` re-asserts the tool-missing and
      # unparseable-output fail-closed paths on THIS unfiltered host, where they fire on
      # every PR. Pure node, no install.
      - name: Enforcer-wiring gate self-test (DR-8, task 015)
        run: bash tests/scripts/check-enforcer-wiring.test.sh

      # Plugin-packaging gate. Its expectations are in
      # `.claude-plugin/packaging-policy.json`, read at runtime. The gate is
      # zero-dependency node behind a thin bash wrapper, so it rides this unfiltered
      # zero-dep prefix and fires on every PR.
      - name: Plugin-packaging gate (DR-24, task 064)
        run: bash tools/audit/gates/validate-plugin.sh

      # Re-assert for the gate above. Its `.test.ts` runs only in the jobs filtered on
      # `root`. This `.test.sh` asserts the fail-closed and
      # non-empty-denominator paths on THIS unfiltered host.
      # See docs/guides/ci-gate-hosting.md.
      - name: Plugin-packaging gate self-test (DR-10, task 064)
        run: bash tests/scripts/validate-plugin.test.sh

      # The aggregating `npm run validate` runner. It runs every step declared in
      # tools/audit/gates/validate-manifest.json and does not short-circuit, so a red
      # early gate cannot hide the later ones. `--list` is the cheap reachability proof
      # for THIS host: it fails when the manifest declares zero steps. The steps have
      # their own wiring elsewhere in this job and in the tsx tail, so a full run here
      # only duplicates them.
      - name: Validate manifest declares a non-empty step list (DR-24, task 064)
        run: node tools/audit/gates/run-validate.mjs --list

      - name: npm-ci-retry helper tests
        run: bash tests/scripts/npm-ci-retry.test.sh

      # TEMP diagnostic (RCA 2026-05-30-state-source-integrity): the MCP `npm ci`
      # wedges fetching native artifacts. Probe each host with hard timeouts to
      # pinpoint which egress hangs from the runner. Non-blocking.
      - name: CDN connectivity probe
        run: |
          set +e
          for url in \
            https://registry.npmjs.org/ \
            https://objects.githubusercontent.com/ \
            https://github.com/WiseLibs/better-sqlite3/releases/ \
            https://nodejs.org/download/release/v24.12.0/SHASUMS256.txt ; do
            echo "--- $url ---"
            curl -sS -o /dev/null -w "  http=%{http_code} connect=%{time_connect}s total=%{time_total}s\n" \
              --connect-timeout 15 --max-time 60 "$url" || echo "  FAILED/timeout: $url"
          done
          echo "probe complete"

      # ─────────────────────────────────────────────────────────────────
      # NOTE: this job is not zero-dependency as a whole. The tsx-backed gates below run
      # `tsx` over the product TypeScript source, so the job installs the package
      # dependencies (step below).
      #
      # Rehydration prefix and prose gates. They run on this UNFILTERED host, so they
      # fire on every PR. Each runs `tsx` on the TypeScript source (fingerprint-cli.ts,
      # prose-lint-cli.ts), so the install comes first. The install stays near the end
      # of the job, so the fast install-free structural gates run first.
      - name: Install root dependencies (for tsx-backed gates)
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      # Duplicate-location ratchet. An (area, basename) intersection guard that FAILS on
      # any legacy __tests__/<area>/<base>.test.ts twin of a co-located subject that is
      # not in the (empty) allowlist. It imports consolidate-suite.mjs, which pulls in
      # `typescript` (a root devDependency), so it rides the root install above, not the
      # zero-dep prefix.
      - name: Duplicate-location ratchet (DR-1, Task 022)
        run: node tools/audit/check-no-duplicate-suites.mjs

      # tsx-tail and bun gates. They ride the UNFILTERED grep-gates host, so they fire on
      # every PR, and they use the dependencies installed above.
      # See docs/guides/ci-gate-hosting.md.

      # Vocabulary lint: a tsx entrypoint whose scan surface is broader than any path
      # filter. Host class: deps tail, unfiltered.
      - name: Vocabulary-lint (DR-8)
        run: npm run lint:invariants

      # Error-envelope lint: scans the registration surface with a dedicated type-aware flat config
      # (eslint.envelopes.config.js), never the shared eslint.config.js. It runs as a lint-*.mjs
      # primary, so the enforcer-wiring checker can see it. It runs on this unfiltered lane, so a
      # registered MCP handler that lets a throw escape fails CI on every pull request.
      - name: Error-envelope lint (#1706 DR-2)
        run: npm run lint:envelopes

      # Self-test re-assert for the wrapper: its fixture-driven both-direction and
      # fail-closed assertions. A PR that skips the filtered test-root suite still proves
      # that the gate can fail.
      - name: Error-envelope lint self-test (#1706 DR-2)
        run: bash tests/scripts/lint-envelopes.test.sh

      # The RULE's own self-test, as distinct from the wrapper's. `lint-envelopes.test.sh`
      # above covers the wrapper's exit codes against one violating fixture; these cases
      # cover the rule's handler resolution (adaptXxx unwrap, zero-arg factory, cast,
      # inline literal, the derived special-branch census, and the fail-loud
      # `unresolvedHandler` / `unattributedDispatch` paths) and its three exemption
      # classes. The case count is deliberately not transcribed here — the file is the
      # authority, and a label that has to be edited alongside it just goes stale.
      # They were executed by NOTHING: it is a `node:test` file with a `.js` extension,
      # and the root vitest `include` list is all `*.test.ts` under
      # src/benchmarks/scripts/hooks/test/docs — no `tools/eslint-rules/**`, no `.js` pattern.
      # A blocking lint rule whose resolution logic is unproven is the shape the
      # rest of this lane exists to prevent.
      - name: Error-envelope RULE self-test
        run: node tools/eslint-rules/no-handler-throw.test.js


      # `tools/eslint-rules/tsconfig.json` exists solely to typecheck `__fixtures__/**/*.ts`
      # and was compiled by nothing either — root `tsconfig.json` includes `src/**/*`
      # and `tsconfig.scripts.json` includes `scripts/**/*.ts`; neither covers this tree.
      - name: Typecheck tools/eslint-rules/
        run: npx --no-install tsc -p tools/eslint-rules/tsconfig.json

      # The comment gate runs on this unfiltered lane, so a change to any path arms it. It runs the
      # shared ESLint configuration (comment rules and Windows-portability rules), the comment scan
      # of shell, YAML and PowerShell files, baseline integrity, and baseline admission against the
      # base branch of the pull request.
      - name: Comment gate
        run: npm run lint:comments

      # The self-tests prove that each check still fails on a seeded violation.
      - name: Comment gate self-test
        run: bash tests/scripts/lint-comments.test.sh
      - name: Windows-portability lint self-test
        run: bash tests/scripts/check-eslint-windows.test.sh

      # A skill in a directory that the upstream `skills` installer scans must be marked internal, or a
      # user who installs from this repository gets it. The test also keeps the `.claude/skills` mirror
      # byte-identical to `.agents/skills`. It runs here because a new scanned directory matches no
      # path filter.
      - name: Repo-local skills test
        run: npx --no-install vitest run --project unit tests/architecture/repo-local-skills.test.ts

      # Advisory and shim ratchets, hosted UNFILTERED. `advisory-registry` walks the gate
      # scripts and `.github/workflows/**`, and the `mcp` filter of their other hosts does
      # not cover all of that surface. This host makes each ratchet fire on every PR,
      # whatever paths the PR touches.
      - name: Advisory + shim ratchets (DR-15/DR-24, unfiltered)
        run: npx --no-install vitest run --project core tests/unit/install/advisory-registry.test.ts tests/unit/install/shim-registry.test.ts

      # CI-topology conformance test on the UNFILTERED host: a root-suite vitest that
      # parses ci.yml and asserts the completeness, evaluate coverage and skip-guard
      # coverage of the ci-gate aggregator. Because it runs here, neither the topology nor
      # the detector can change without the detector running on that PR.
      # Host class: deps tail, unfiltered.
      - name: CI-topology conformance test (DR-2)
        run: npx --no-install vitest run tests/scripts/ci-topology.test.ts

      # Typecheck of the `tsconfig.scripts.json` project. Root `tsconfig.json` includes
      # only `src/**/*`, so this step typechecks the guards in that project.
      #
      # It runs on this unfiltered host, not in test-root or test-mcp. The scan surface
      # is the scripts project PLUS the `src/` modules that its guards import, and an
      # unfiltered host makes the two-surface subset rule hold trivially.
      # Host class: deps tail, unfiltered. See docs/guides/ci-gate-hosting.md.
      - name: Typecheck the root `scripts/` tree (task 066, DR-24)
        run: npx tsc -p tsconfig.scripts.json

      # The self-test of the guard, on the same host, so a guard-execution failure cannot
      # pass as success. `tsc -p` fails on a config that resolves ZERO files (TS18003),
      # but it exits 0 when a config stops covering the guards. This test asserts the
      # resolved file set against a coverage floor, and it holds the zero-file kill
      # fixture.
      - name: scripts/ typecheck coverage self-test (task 066, DR-24)
        run: npx --no-install vitest run tests/scripts/tsconfig-scripts-coverage.test.ts

      # Cast-census scope: the census roots must cover every tree that the tsconfig
      # projects compile, so no directory is typechecked by one gate and missed by the
      # other. It runs unfiltered for the same reason as the typechecks above.
      - name: Cast-census scope + budget ratchet (DR-14, task 066)
        run: npx --no-install vitest run --project core tests/unit/tsconfig-strictness.test.ts

      # Self-test re-assert for check-mutation-gate. Its invocation seam drives the real
      # mutation-adequacy handler through a bun bridge (EventStore needs bun:sqlite), so
      # it needs bun AND the node_modules installed above. grep-gates sets up bun only
      # here, with the same oven-sh/setup-bun@v2 step as test-mcp. The other two
      # re-asserts (type-debt, coverage-ratchet) are zero-dep node in the prefix above.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: check-mutation-gate self-test re-assert (DR-10)
        run: bash tests/scripts/check-mutation-gate.test.sh

      - name: Prefix-fingerprint gate — rehydration stable-prefix drift (DR-12)
        run: node tools/audit/gates/check-prefix-fingerprint.mjs

      - name: Prose-lint gate — rehydration prose slop (DR-13)
        run: node tools/audit/gates/check-prose-lint.mjs

      # Primary-owner population census (#1854 K2). `--check` re-derives the
      # census and compares it byte for byte with the checked-in JSON, so the
      # measurement behind `PRIMARY_OWNER_POPULATION_FLOOR` cannot drift from
      # the catalog it is supposed to describe.
      #
      # WIRED LATE, and the reason is the point: it was written with no caller.
      # Its extractor read `action.autoEmits`, which `withActionContract`
      # strips from every registered action, so from the day the action-contract
      # closure landed the census resolved ZERO edges and threw on every run.
      # Nothing invoked it — not this workflow, not package.json, not a test —
      # so it stayed broken and its output stayed stale for months. A census
      # nothing runs is a census nobody can rely on.
      #
      # Rides the deps tail: the extractor shells out to `tsx` and imports the
      # live registry, which pulls the SQLite substrate.
      - name: Primary-owner population census (#1854 K2)
        run: node tools/audit/core/measure-primary-owner-population.mjs --check

      # Measured-premise drift gate. It binds each annotated numeric claim in the
      # internal-mechanics-overhaul spec and the invariants catalog to the artifact that
      # produces it, so the document cannot assert a number that nothing derives. The
      # `outputSchema` census and `EventTypes` derivations run `tsx` over the source, so
      # this step rides the deps tail. It is unfiltered on purpose: the premises drift
      # when the CODE changes, and a docs-path filter skips exactly that PR.
      #
      # The gate has THREE verdicts: pass (exit 0), fail (exit 1) and gaps (exit 3).
      # `--tolerate-gaps-until` maps gaps to exit 0 through that date and to exit 1 after
      # it. This lane tolerates gaps, because the unprobed obligation rungs are open work,
      # not a broken gate. Drift, an empty denominator and an unannotated rung row always
      # fail.
      - name: Measured-premise drift gate (DR-27)
        run: node tools/audit/gates/check-measured-premises.mjs --tolerate-gaps-until 2026-11-30


      # Its self-test on the same host, so a guard-execution failure cannot pass as
      # success. It includes the rev-3 kill fixture: a document known to be wrong, which
      # the checker must report as drifted.
      - name: Measured-premise gate self-test (DR-27)
        run: npx --no-install vitest run tests/scripts/check-measured-premises.test.ts

      # No-circular runtime import-cycle ratchet. It runs the root dependency-cruiser over
      # src, computes the runtime cycles (Tarjan SCC, in import-cycles.ts), and compares
      # them with tools/audit/cycle-baseline.json. It fails CLOSED on an unbaselined
      # cycle, an expired waiver, a PHANTOM entry (a baselined edge with no live cycle),
      # or missing or unparseable depcruise output (exit 2). It is blocking: the shared
      # config sets `no-circular` to `warn` so runBoundaryLint stays green, and this step
      # holds the ratchet. Self-tests: the failure-mode cases in
      # tests/scripts/audit/cycle-gate.test.ts, in the root unit suite (test-root).
      - name: No-circular cycle ratchet (DR-4/DR-8, task 010)
        run: npx --no-install tsx tools/audit/cycle-gate.ts

      # Fail-closed self-tests for the two tsx-backed audit gates. Their `.test.ts` cases
      # run only in the jobs filtered on `root`. These `.test.sh` files re-assert
      # the tool-missing and unparseable-output fail-closed paths here. They drive the
      # REAL CLI through the EXARCHOS_{DEPCRUISE,KNIP}_BIN seam (a missing path or a stub
      # that emits garbage), so depcruise and knip do not need to resolve.
      - name: Cycle-gate ratchet self-test (DR-8, task 015)
        run: bash tests/scripts/audit/cycle-gate.test.sh

      - name: Knip-diff gate self-test (DR-8, task 015)
        run: bash tests/scripts/audit/knip-diff.test.sh

      # Module-intent gate. It takes reachability from the vendored
      # tools/audit/refgraph.mjs detector, then requires each dead-in-prod module
      # (0 production importers) to declare intent: a RESERVED(issue, owner, expires)
      # header that has not expired, OR membership in a declared allowlist class. An
      # expired RESERVED header fails. The gate fails CLOSED (exit 2) on a scan crash,
      # unparseable detector output or an unreadable module. Zero-dependency node.
      # Self-tests: tests/scripts/check-module-intent.test.ts, in the root unit suite.
      - name: Module-intent gate (DR-7/DR-8, task 013)
        run: node tools/audit/gates/check-module-intent.mjs

      # Fail-closed self-test. The `.test.ts` of the gate runs only in the jobs filtered
      # on `root`. This `.test.sh` re-asserts the tool-missing and
      # unparseable-output fail-closed paths here, through the `--refgraph` seam (a
      # missing detector or a stub that emits garbage). Pure node, no install.
      - name: Module-intent gate self-test (DR-8, task 015)
        run: bash tests/scripts/check-module-intent.test.sh

      # Guard inventory and CI-reachability proof. It parses this workflow, the
      # package.json scripts, the vitest projects and the enforcer-wiring manifest. Then
      # it proves that some CI job runs each inventoried guard, or that the guard has a
      # recorded, EXPIRING reason. It reports path-filtered hosting (the #1711
      # skipped-as-passed failure) and fails closed on a zero-guard resolution.
      # This step IS the guard: the module is a library, and its assertions are in the
      # test. It must be UNFILTERED, so it runs on the PR that edits this inventory. It
      # rides the deps tail (vitest, typescript and js-yaml from the root install).
      # See docs/guides/ci-gate-hosting.md.
      - name: Wave-1 guard-inventory reachability proof (DR-24, task 063)
        run: npx --no-install vitest run tests/scripts/guard-inventory.test.ts

      # Cast-census self-test re-assert for `tools/audit/tsconfig-strictness/count-casts.ts`.
      # This unfiltered host runs it, so a PR outside the `root` filter still exercises
      # the census implementation. It is the fixture-driven SELF-TEST only (tmpdir and
      # string inputs). The repo-wide ratchet is `tests/unit/tsconfig-strictness.test.ts`,
      # so this step adds no repo-wide assertion.
      - name: Cast-census self-test re-assert (DR-24, unfiltered)
        run: npx --no-install vitest run tests/scripts/tsconfig-strictness/count-casts.test.ts

      # G2 `outputSchema` vacuity ratchet. It checks membership (allowlist against
      # census, both directions), seed key-set integrity (against the frozen digest),
      # and the per-entry EXPIRY, which it enforces.
      #
      # This is the one place where the mechanism reads the wall clock. The library
      # takes `today` as a required argument, so its unit tests are deterministic, and
      # the deadline fails the MERGE, not a local `vitest run`. Expect it to fail on its
      # own after VACUITY_EXPIRY_HORIZON (2027-02-28). The repair is to pay declarations
      # down, never to re-date the horizon.
      #
      # It rides the deps tail: it needs `tsx` and the node_modules to resolve the Zod
      # objects of the registry, because a source-text grep cannot see through a named
      # binding. It must be UNFILTERED: the ratchet governs a repo-wide contract, and an
      # `mcp`-filtered host skips-as-passed on any PR outside that filter.
      # See docs/guides/ci-gate-hosting.md.
      - name: outputSchema vacuity ratchet — G2 + enforced expiry (DR-4, task 017)
        run: npx --no-install tsx tools/audit/core/output-schema-ratchet-guard.ts

      # Its self-tests on the SAME host, so a guard-execution failure cannot pass as
      # success. They include kill fixtures: the live seed carried one day past its
      # horizon, and a blanket "bump every date in one commit" renewal. Both must fail.
      #
      # The census and its selftest are in `tools/conformance`, and the whole-suite step
      # below hosts them. This step names the ratchet guard test and the allowlist test.
      # Both halves must stay hosted on this unfiltered job.
      - name: outputSchema ratchet self-tests re-assert (DR-4/DR-24, unfiltered)
        run: >-
          npx --no-install vitest run
          tests/core/scripts/output-schema-ratchet-guard.test.ts
          src/output-schema-vacuity-allowlist.test.ts

      # THE WHOLE extracted conformance suite, unfiltered — G2's census and
      # selftest, G3, G5, and every other census task 018a moved out.
      #
      # One step for the package rather than one per guard, and the reason is
      # the two-surface subset rule rather than brevity. These censuses now live
      # under `tools/conformance/**`, which no `dorny/paths-filter` key matches,
      # so their only other host (`test-root`, filtered on `root`) is armed by
      # NO PR that edits them: #1711's skipped-as-passed, pointed at the
      # enforcement suite itself. An unfiltered host clears it for the whole
      # package at once, and cannot go stale as the package grows.
      #
      # The alternative was widening `root` to cover `tools/conformance/**`.
      # Rejected for the reason already recorded in GUARD_EXEMPTIONS: that key
      # also arms `test-windows-root`, the lane #1699 has never proven green.
      - name: Conformance suite — every extracted census (DR-2/DR-4/DR-6/DR-24, unfiltered)
        run: npm run test:conformance

      # G1 CLI-derivation allowlist ratchet. It parses the CLI composition root, derives
      # the population of hand-written literals from that parse, and holds it to a
      # shrink-only allowlist. Membership is checked in BOTH directions: an untracked
      # literal fails, and a tracked name that is no longer a literal is stale. A frozen
      # key-set pin over `allowed ∪ retired` catches an in-place swap. A per-entry ISO
      # expiry is ENFORCED and capped by one pinned horizon, so a waiver cannot renew
      # itself.
      #
      # This is the one place where the mechanism reads the wall clock. The library
      # takes `today` as a required argument, so its unit tests are deterministic, and
      # the deadline fails the MERGE, not a local `vitest run`. Expect it to fail on its
      # own after CLI_DERIVATION_EXPIRY_HORIZON (2027-02-28). The repair is to register
      # verbs through a derivation helper, never to re-date the horizon.
      #
      # This is the RATCHET entrypoint. Its DERIVATION sibling runs directly below. The
      # ratchet states the SHRINK-ONLY policy over the tolerated set. The sibling states
      # the DERIVATION policy ("no un-allowlisted literal `.command(` at all"). Both are
      # blocking.
      #
      # It rides the deps tail: it needs `tsx` and `typescript`. It parses the source and
      # never resolves `buildCli`, so it needs neither Bun nor `bun:sqlite`. It must be
      # UNFILTERED, because an `mcp`-filtered host skips-as-passed on any PR outside
      # that filter. See docs/guides/ci-gate-hosting.md.
      - name: CLI derivation allowlist ratchet — G1 shrink-only + enforced expiry (DR-5, task 023)
        run: npx --no-install tsx tools/audit/core/cli-derivation-ratchet-guard.ts

      # G1 DERIVATION entrypoint, direct and BLOCKING. `merge-orchestrate` gets its
      # top-level promotion from the registry `cli.topLevel` hint, so a clean tree has no
      # un-allowlisted literal command and this entrypoint passes. `guard-inventory`
      # reports it as `enforcement: blocks`, `pathFilteredOnly: false`, `via=direct`.
      #
      # It runs DIRECTLY (no `npm run` wrapper), so the indirection resolver of the
      # inventory records `via=direct` and does not walk a shell shim. Same host class as
      # the ratchet above: deps tail, unfiltered, for the same reason.
      - name: CLI derivation guard — G1 no un-allowlisted literal commands (DR-5, task 076)
        run: npx --no-install tsx tools/audit/core/cli-derivation-guard.ts

      # Its self-tests, plus those of the DERIVATION guard, on the SAME host. They hold
      # the kill probes: a seeded extra entry, an in-place swap, a paydown recorded as a
      # deletion, the live seed carried one day past its horizon, the blanket "bump every
      # date" renewal and an emptied allowlist. A further proof splices the deleted
      # `merge-orchestrate` command back into the real composition root and re-runs the
      # guard, and a separate assertion pins that the LIVE tree does not carry it. Their
      # other hosts, `test-mcp` and `test-windows`, are filtered on `mcp`, so a PR
      # outside that filter skips them there.
      - name: CLI derivation guard + ratchet self-tests re-assert (DR-5/DR-24, unfiltered)
        run: >-
          npx --no-install vitest run
          tests/core/scripts/cli-derivation-ratchet-guard.test.ts
          tests/core/scripts/cli-derivation-guard.test.ts
          tests/core/scripts/cli-vocab-guard.test.ts

      # G3 report-coupled ratchet. It enumerates the live event registry, derives the
      # coupling of each registration through the tier union, and holds the
      # report-coupled population to a shrink-only seed (membership, ISO expiry, and a
      # frozen key-set pin against in-place swaps).
      #
      # There are TWO steps on purpose. The executable gate reads the wall clock. The
      # library takes `today` as a required parameter and reads no clock, so the
      # enforced expiry fails the artifact that blocks a merge, not the `vitest run` of
      # a developer.
      #
      # Both must be UNFILTERED, because a path-filtered host skips-as-passed on the PRs
      # that this gate polices. They ride the deps tail, not the zero-dep prefix.
      - name: G3 report-coupled ratchet — executable gate
        run: npx --no-install tsx tools/audit/core/report-coupling-ratchet-guard.ts

      # The kill fixtures (a seeded 26th report-coupled registration, an emptied
      # denominator, a seeded tier/source disagreement, an in-place swap, a lapsed
      # expiry) on the SAME host, so guard-execution failure exits non-zero here
      # rather than passing as success.
      - name: G3 report-coupled ratchet self-tests re-assert
        run: npx --no-install vitest run tools/conformance/src/report-coupling-census.test.ts --project conformance


      # G4 effect-ledger self-test, hosted UNFILTERED. Its other hosts, `test-mcp` and
      # `test-windows`, are filtered on `mcp`, so alone they skip-as-passed on the PRs
      # that the guard polices (#1711). `guard-inventory` reports that condition.
      #
      # This step wires HOSTING, not enforcement severity. G5, the authority-topology
      # census, stays observe-then-enforce PER ROW through the `enforceFrom` field of
      # each row, and the whole-suite conformance step above hosts it.
      #
      # The G4 subject is `src/architecture/effect-ledger.ts`. It stays in `src/`
      # because it has production consumers, and its self-test is in the `tests/unit/`
      # mirror.
      - name: G4 effect-ledger self-test (DR-7/DR-24, unfiltered)
        run: npx --no-install vitest run tests/unit/architecture/effect-ledger.test.ts

      # G5's census moved with G3's; the whole-suite step above hosts it.

      # The event-name grammar census and its two-way ratchet are in `tools/conformance`.
      # The whole-suite step above hosts them, unfiltered, because the census governs a
      # repo-wide naming contract. The census enumerates the LIVE registry at runtime
      # (`getValidEventTypes()`), so custom `registerEventType` names are in the
      # denominator. A registered name that the grammar rejects fails, and a recorded
      # concession that no live name uses fails as stale cover.
      #
      # The concession deadline fails the MERGE. Expect it to fail on its own after the
      # seeded expiry (2027-02-28). The repair is to retire the concession, never to
      # re-date it. See docs/guides/ci-gate-hosting.md.

      # Audit-delivery closure. It holds each declared delivery obligation to BOTH
      # halves: the live `outputSchema` of the producing action must declare the
      # delivered field and its enumerator as required typed properties, and a declared
      # reader document must carry the whole instruction inside one section. The module
      # is a pure library, so this test file IS the guard. It holds the kill fixtures (a
      # vacuous contract, a reader that only invokes the gate, scattered mentions, an
      # emptied obligation list).
      #
      # It must be UNFILTERED: the obligation binds a file under the `mcp` filter to one
      # under `content/**`, so EITHER path filter skips-as-passed on the PR that breaks
      # the binding from the other side. It rides the deps tail, because it walks live
      # Zod objects. See docs/guides/ci-gate-hosting.md.
      - name: Audit-delivery closure (DR-4/DR-24, task 069)
        run: npx --no-install vitest run --project core tests/unit/architecture/audit-delivery-closure.test.ts

  # ─────────────────────────────────────────────────────────────────────
  # e2e-process
  # ─────────────────────────────────────────────────────────────────────
  # Runs the `process` vitest project against a real compiled binary. The setupFiles
  # of the project assert that `exarchos` is on PATH, so the job builds the host
  # (linux-x64) binary and symlinks it before vitest runs.
  #
  # The job covers the process-fidelity matrix of the e2e harness:
  #   - P1 fixtures (preflight, runCli, spawnMcpClient, normalizers)
  #   - P2 saga primitives and the #1208 regression
  #   - P3 parity tests (workflow.describe, event.query, workflow.rehydrate with
  #     F6.1 reconstructability)
  #   - P4 CLI surface tests (version, doctor, install-skills, schema, topology,
  #     emissions, mcp start/stop)
  #
  # Linux only. No job covers Windows process fidelity.
  #
  # DISPOSITION: NON-BLOCKING. The job is not in `ci-gate.needs`. Over 60 completed
  # `ci.yml` runs (2026-07-17) it ran 60 times (no path filter) and failed 2 times, a
  # 3.33% failure rate. Both failures were in the "Run process-fidelity suite" step,
  # consistent with the known SQLITE_BUSY flake cluster. That rate is above the 2%
  # blocking threshold, so the non-blocking allowlist in
  # `tests/scripts/ci-topology.test.ts` records the job with this rate. Burn-down:
  # lvlup-sw/exarchos#1718. Host class: deps, unfiltered, suite-shaped.
  # See docs/guides/ci-gate-hosting.md.
  # ─────────────────────────────────────────────────────────────────────
  e2e-process:
    name: E2E Process (linux-x64)
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # One closure: vitest and the build-binary toolchain are in the same manifest as
      # pino, commander, @modelcontextprotocol, zod and yaml.
      - name: Install dependencies
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      - name: Build host binary (linux-x64)
        run: bun run tools/release/build-binary.ts --target linux-x64

      - name: Symlink exarchos onto PATH
        run: sudo ln -s "$PWD/dist/bin/exarchos-linux-x64" /usr/local/bin/exarchos

      - name: Verify exarchos on PATH
        run: which exarchos && exarchos --version

      - name: Run process-fidelity suite
        run: npm run test:process

  # ─────────────────────────────────────────────────────────────────────
  # outcome-tests
  # ─────────────────────────────────────────────────────────────────────
  # Runs the `outcome` vitest project (the data-safety substrate). The tier exercises
  # operator-visible behavior with real OS state (tmpdir HOME, real git repos with
  # sibling worktrees) through the helpers under `tests/outcome/_helpers/`.
  #
  # Linux-only by design: the helpers use POSIX-style path semantics and
  # `git worktree` invocations that are not validated on Windows.
  #
  # NOTE: a required branch-protection check for this job is a manual repo-settings
  # step (Settings → Branches → main → required status checks).
  # ─────────────────────────────────────────────────────────────────────
  outcome-tests:
    name: Outcome Tests (linux-x64)
    needs: plan
    if: ${{ always() && (needs.plan.result != 'success' || fromJSON(needs.plan.outputs.lanes).always != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          # Same better-sqlite3 / isolate-teardown abort as the MCP jobs.
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # One closure: vitest, the `bun:sqlite` alias target of the outcome project, and
      # `better-sqlite3` (the runtime dependency of the shim) come from one manifest.
      - name: Install dependencies
        run: bash "$GITHUB_WORKSPACE/tools/release/npm-ci-retry.sh"

      # The install-skills outcome test invokes the platform binary at
      # `dist/bin/exarchos-<os>-<arch>`. Without this build step the test
      # silently degrades to "no on-disk effects → empty manifest →
      # assertion failure", which masks real regressions in the installer.
      - name: Build host binary (linux-x64)
        run: bun run tools/release/build-binary.ts --target linux-x64

      - name: Configure git identity for outcome helpers
        run: |
          git config --global user.email "outcome-tests@example.com"
          git config --global user.name "outcome-tests"

      - name: Run outcome-tier suite
        run: npm run test:outcome

  # Always-on jobs (validate-no-legacy, manifest-gate, grep-gates, outcome-tests)
  # are targeted on lane `always` (paths: ** ) so this required check still
  # aggregates them. binary-matrix and e2e-process stay untargeted (non-blocking).
  # lanes-check is untargeted; its failure still fails the workflow run.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [plan, test-root, test-mcp, test-windows, test-windows-root, validate-no-legacy, manifest-gate, grep-gates, outcome-tests]
    if: always()
    steps:
      - uses: lvlup-sw/.github/actions/ci-lanes@v1
        with:
          mode: verdict
          gate: ci-gate
          needs: ${{ toJSON(needs) }}

