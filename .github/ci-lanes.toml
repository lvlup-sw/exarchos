schema_version = 1

# Root package tests (Linux + Windows). Globs match the former dorny `root`
# filter, including the DR-22 projection roots a docs-only PR must not skip.
[lanes.root]
workflows = ["ci.yml"]
description = "Root package tests (Linux + Windows)"
paths = [
  "src/**",
  "tests/**",
  "content/**",
  "content/harness/runtimes/**",
  "rendered/**",
  "hooks/**",
  "content/harness/hooks/**",
  "binding/**",
  "content/harness/binding/**",
  ".claude-plugin/**",
  "src/runtime/agents/**",
  "AGENTS.md",
  "package.json",
  "package-lock.json",
  "tsconfig.json",
  ".github/workflows/release.yml",
  "tools/**",
  ".github/CODEOWNERS",
  ".bun-version",
  "knip.json",
  ".exarchos/**",
  "manifest.json",
  "eslint.config.js",
  "CLAUDE.md",
  ".claude/**",
  ".agents/**",
]

# MCP server tests (Linux). Former `mcp` filter plus former `prompts`
# paths, so test-mcp belongs to exactly one lane. RUN_EVALS is always on when
# this job runs.
[lanes.mcp]
workflows = ["ci.yml"]
description = "MCP server tests (Linux), including eval sources"
paths = [
  "src/**",
  "tests/**",
  "tools/**",
  "tools/test-helpers/**",
  "vitest.config.ts",
  "package.json",
  "package-lock.json",
  "content/**",
  "rendered/**",
  "tests/evals/**",
  "tools/evals/evals/**",
  "tools/evals-pkg/**",
  "src/workflow/playbooks.ts",
  ".bun-version",
]

[lanes.testgen]
workflows = ["ci.yml"]
description = "Installed testgen command and native TUnit smoke"
paths = [
  "src/testgen/**",
  "src/architecture/**",
  "src/contract/sdk/**",
  "tests/unit/testgen/**",
  "tests/architecture/**",
  "tests/support/testgen/**",
  "content/review/skills/test-campaign/**",
  "tools/release/codegen-testgen.ts",
  "tools/release/testgen-smoke.mjs",
  "package.json",
  "package-lock.json",
  ".bun-version",
  ".npmrc",
  ".github/ci-lanes.toml",
  ".github/workflows/ci.yml",
  ".github/workflows/release.yml",
]

# Always-on jobs that CI Gate still aggregates. `**` keeps the lane true on
# virtually every PR (including README.md / docs) so a skip cannot hide a
# failure of grep-gates, outcome-tests or e2e-process.
[lanes.always]
workflows = ["ci.yml"]
description = "Jobs CI Gate must still aggregate on every PR"
paths = ["**"]

[gates.ci-gate]
workflow = "ci.yml"
jobs = { test-root = "root", test-windows-root = "root", test-mcp = "mcp", grep-gates = "always", outcome-tests = "always", e2e-process = "always", testgen = "testgen" }

[[fixtures]]
name = "docs-only"
files = ["README.md"]
expect = { root = false, mcp = false, testgen = false, always = true }


[[fixtures]]
name = "testgen-source"
files = ["src/testgen/contract/schemas.ts"]
expect = { root = true, mcp = true, testgen = true, always = true }
