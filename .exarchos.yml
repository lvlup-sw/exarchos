# Exarchos project configuration
# See: docs/guide/configuration.md

# The mutation-adequacy runner. It points at the repo-local adapter
# (tools/audit/core/stryker-adapter.mjs), not the built-in `npx stryker run`.
# The adapter header gives the reasons.
mutation: node tools/audit/core/stryker-adapter.mjs

agents:
  default-model: opus
  models:
    implementer: opus
    fixer: opus
    reviewer: sonnet
    scaffolder: haiku

review:
  dimensions:
    D1: blocking
    D2: blocking
    D3: blocking
    D4: blocking
    D5: blocking

vcs:
  provider: github

workflow:
  max-fix-cycles: 3
  # Plan-review revision cap. Raised from the default (1) to allow the
  # harness-launcher rev.4 revision after a fresh independent adversarial
  # panel refuted the round-4 "survives-after-polish" self-assessment.
  max-plan-revisions: 5

tools:
  commit-style: conventional
  auto-merge: true
  pr-strategy: github-native

plugins:
  impeccable:
    enabled: true

# invariants-catalog: the catalogs that this repo loads.
#
# Registration in `catalogs:` is the only opt-in. The dev catalog is a
# `{ path, tier }` registration like a user catalog, so it goes through the same
# `resolveCatalogSources` discovery. `tier: dev` sets only the audience scope.
#
# The config schema changes the deprecated `devCatalog: enabled` key into this
# registration, and `exarchos doctor` reports the key as deprecated.
#
# To author new entries, run `/exarchos:invariants`.
invariants:
  catalogs:
    - { path: .exarchos/invariants.md, tier: dev }
