# Fixture for the completeness check of the CI topology test. The top-level job
# `orphan-job` is in neither `ci-gate.needs` nor the non-blocking allowlist of
# that test. The check must name `orphan-job` as a violation.
name: CI Fixture - Unlisted Job
on: push

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
    steps:
      - run: echo noop

  blocking-job:
    name: Blocking Job
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - run: echo noop

  orphan-job:
    name: Orphan Job (unlisted)
    runs-on: ubuntu-latest
    steps:
      - run: echo noop

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, blocking-job]
    steps:
      - name: Evaluate results
        run: |
          if [[ "${{ needs.changes.result }}" =~ ^(failure|cancelled)$ ]]; then
            exit 1
          fi
          if [[ "${{ needs.blocking-job.result }}" =~ ^(failure|cancelled)$ ]]; then
            exit 1
          fi
