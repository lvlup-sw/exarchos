# Synthetic fixture (finding 7 decoy, skip-guard coverage): `test-root` is in
# `ci-gate.needs`, is PATH-FILTERED (its `if:` references
# `needs.changes.outputs.root`), and DOES have a failure|cancelled evaluate
# clause — but its fail-closed SKIP-GUARD has been REMOVED. Left behind is a
# decoy prose comment that names `needs.changes.outputs.root`, `test-root`, and
# `skipped` all together. A 240-char window would find those tokens near the
# evaluate clause and FALSE-PASS; the structural matcher only inspects
# `if [[ ... ]]` conditions, so it still trips the SKIP-GUARD-COVERAGE assertion.
name: CI Fixture - Decoy Comment (Skip Guard)
on: push

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
    steps:
      - run: echo noop

  test-root:
    name: Root Package
    needs: changes
    if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request') && needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo noop

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, test-root]
    steps:
      - name: Evaluate results
        run: |
          if [[ "${{ needs.changes.result }}" =~ ^(failure|cancelled)$ ]]; then
            exit 1
          fi
          if [[ "${{ needs.test-root.result }}" =~ ^(failure|cancelled)$ ]]; then
            exit 1
          fi
          # If needs.changes.outputs.root == true and test-root was skipped this
          # would be a path-filter regression — but that fail-closed skip-guard
          # was removed; only this comment naming root + skipped remains.
          echo "no skip-guard for test-root here"
