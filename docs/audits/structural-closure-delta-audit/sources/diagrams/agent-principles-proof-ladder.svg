<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860">
  <title>Verification proof ladder</title>
  <desc>Correctness claims should be assigned to the lowest sound proof layer, from generation and compilation through integration tests and human judgment.</desc>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Menlo', 'Consolas', monospace }
    .title { fill: #f8fafc; font-size: 17px; font-weight: 700 }
    .head { fill: #e2e8f0; font-size: 11px; font-weight: 700 }
    .small { fill: #94a3b8; font-size: 10px }
    .note { fill: #cbd5e1; font-size: 11px }
  </style>

  <rect width="860" height="470" rx="10" fill="#0a0a14"/>
  <text class="title" x="430" y="34" text-anchor="middle">Assign each claim to the lowest sound proof</text>

  <polygon points="105,388 755,388 690,335 170,335" fill="#052e2b" stroke="#2dd4bf" stroke-width="1.5"/>
  <text class="head" x="430" y="365" text-anchor="middle">CONSTRUCTION + GENERATION</text>
  <text class="small" x="430" y="382" text-anchor="middle">repeated representations cannot drift</text>

  <polygon points="170,326 690,326 635,275 225,275" fill="#0f2f3d" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="head" x="430" y="303" text-anchor="middle">COMPILER + STRUCTURAL ANALYSIS</text>
  <text class="small" x="430" y="320" text-anchor="middle">shape, state, ownership, graph closure</text>

  <polygon points="225,266 635,266 585,215 275,215" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="head" x="430" y="243" text-anchor="middle">CONTRACT + COMPONENT TESTS</text>
  <text class="small" x="430" y="260" text-anchor="middle">boundary behavior and local semantics</text>

  <polygon points="275,206 585,206 540,155 320,155" fill="#312e1b" stroke="#fbbf24" stroke-width="1.5"/>
  <text class="head" x="430" y="183" text-anchor="middle">INTEGRATION + END-TO-END</text>
  <text class="small" x="430" y="200" text-anchor="middle">composition, packaging, user outcomes</text>

  <polygon points="320,146 540,146 500,95 360,95" fill="#3f1d2e" stroke="#f472b6" stroke-width="1.5"/>
  <text class="head" x="430" y="123" text-anchor="middle">HUMAN JUDGMENT</text>
  <text class="small" x="430" y="140" text-anchor="middle">intent, tradeoffs, novel risk</text>

  <line x1="72" y1="382" x2="72" y2="102" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 66 110 L 72 96 L 78 110" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text class="small" x="55" y="244" text-anchor="middle" transform="rotate(-90 55 244)">higher recurring cost and semantic scope</text>

  <text class="note" x="430" y="427" text-anchor="middle">Higher layers do not replace lower layers.</text>
  <text class="small" x="430" y="447" text-anchor="middle">They prove claims that construction and static checks cannot.</text>
</svg>
