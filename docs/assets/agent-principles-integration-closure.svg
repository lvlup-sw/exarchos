<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860">
  <title>Integration completeness as graph reachability</title>
  <desc>A complete capability has a reachable path from public root through route, handler, port, and adapter to an observable effect. An orphan handler is present but unreachable.</desc>

  <defs>
    <marker id="graph-arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="graph-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Menlo', 'Consolas', monospace }
    .title { fill: #f8fafc; font-size: 17px; font-weight: 700 }
    .head { fill: #e2e8f0; font-size: 11px; font-weight: 700 }
    .small { fill: #94a3b8; font-size: 10px }
    .node { fill: #111827; stroke: #334155; stroke-width: 1.5 }
    .root { fill: #172554; stroke: #60a5fa; stroke-width: 2 }
    .effect { fill: #052e2b; stroke: #2dd4bf; stroke-width: 2 }
    .orphan { fill: #3f1d1d; stroke: #f87171; stroke-width: 1.5 }
    .good { fill: none; stroke: #2dd4bf; stroke-width: 2; marker-end: url(#graph-arrow-good) }
    .bad { fill: none; stroke: #f87171; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#graph-arrow-bad) }
  </style>

  <rect width="860" height="430" rx="10" fill="#0a0a14"/>
  <text class="title" x="430" y="34" text-anchor="middle">Capability completeness is reachability</text>

  <rect class="root" x="30" y="120" width="130" height="66" rx="7"/>
  <text class="head" x="95" y="147" text-anchor="middle">PUBLIC ROOT</text>
  <text class="small" x="95" y="168" text-anchor="middle">CLI / API</text>

  <rect class="node" x="195" y="120" width="120" height="66" rx="7"/>
  <text class="head" x="255" y="147" text-anchor="middle">ROUTE</text>
  <text class="small" x="255" y="168" text-anchor="middle">transport</text>

  <rect class="node" x="350" y="120" width="120" height="66" rx="7"/>
  <text class="head" x="410" y="147" text-anchor="middle">HANDLER</text>
  <text class="small" x="410" y="168" text-anchor="middle">dispatch</text>

  <rect class="node" x="505" y="120" width="120" height="66" rx="7"/>
  <text class="head" x="565" y="147" text-anchor="middle">PORT</text>
  <text class="small" x="565" y="168" text-anchor="middle">domain contract</text>

  <rect class="node" x="660" y="120" width="120" height="66" rx="7"/>
  <text class="head" x="720" y="147" text-anchor="middle">ADAPTER</text>
  <text class="small" x="720" y="168" text-anchor="middle">persistence / API</text>

  <path class="good" d="M 160 153 L 195 153"/>
  <path class="good" d="M 315 153 L 350 153"/>
  <path class="good" d="M 470 153 L 505 153"/>
  <path class="good" d="M 625 153 L 660 153"/>
  <path class="good" d="M 720 186 L 720 246"/>

  <rect class="effect" x="630" y="246" width="180" height="72" rx="8"/>
  <text class="head" x="720" y="275" text-anchor="middle">OBSERVABLE EFFECT</text>
  <text class="small" x="720" y="297" text-anchor="middle">durable state or output</text>

  <rect class="orphan" x="290" y="286" width="180" height="68" rx="7"/>
  <text class="head" x="380" y="313" text-anchor="middle">ORPHAN HANDLER</text>
  <text class="small" x="380" y="335" text-anchor="middle">present, tested, unreachable</text>
  <path class="bad" d="M 380 286 L 410 186"/>

  <text class="small" x="95" y="376">Complete: root reaches effect through conformant edges.</text>
  <text class="small" x="95" y="397" fill="#f87171">Incomplete: a node exists without a production path.</text>
</svg>
