<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860">
  <title>Contract generation reduces independent representations</title>
  <desc>One executable contract generates static types, validators, clients, server interfaces, errors, fixtures, compatibility metadata, and documentation. CI prevents generated drift.</desc>

  <defs>
    <marker id="contract-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Menlo', 'Consolas', monospace }
    .title { fill: #f8fafc; font-size: 17px; font-weight: 700 }
    .head { fill: #e2e8f0; font-size: 12px; font-weight: 700 }
    .label { fill: #cbd5e1; font-size: 11px }
    .small { fill: #94a3b8; font-size: 10px }
    .source { fill: #172554; stroke: #60a5fa; stroke-width: 2 }
    .product { fill: #111827; stroke: #334155; stroke-width: 1.5 }
    .guard { fill: #052e2b; stroke: #2dd4bf; stroke-width: 1.5 }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#contract-arrow) }
  </style>

  <rect width="860" height="430" rx="10" fill="#0a0a14"/>
  <text class="title" x="430" y="34" text-anchor="middle">One source, generated boundary</text>

  <rect class="source" x="325" y="70" width="210" height="72" rx="8"/>
  <text class="head" x="430" y="98" text-anchor="middle">EXECUTABLE CONTRACT</text>
  <text class="small" x="430" y="119" text-anchor="middle">versioned IDL or schema</text>

  <path class="edge" d="M 355 142 L 122 190"/>
  <path class="edge" d="M 385 142 L 282 190"/>
  <path class="edge" d="M 415 142 L 442 190"/>
  <path class="edge" d="M 445 142 L 602 190"/>
  <path class="edge" d="M 475 142 L 762 190"/>

  <rect class="product" x="40" y="190" width="164" height="64" rx="6"/>
  <text class="head" x="122" y="216" text-anchor="middle">TYPES</text>
  <text class="small" x="122" y="237" text-anchor="middle">input and output</text>

  <rect class="product" x="200" y="190" width="164" height="64" rx="6"/>
  <text class="head" x="282" y="216" text-anchor="middle">VALIDATORS</text>
  <text class="small" x="282" y="237" text-anchor="middle">parse at boundaries</text>

  <rect class="product" x="360" y="190" width="164" height="64" rx="6"/>
  <text class="head" x="442" y="216" text-anchor="middle">CLIENT + SERVER</text>
  <text class="small" x="442" y="237" text-anchor="middle">shared protocol shape</text>

  <rect class="product" x="520" y="190" width="164" height="64" rx="6"/>
  <text class="head" x="602" y="216" text-anchor="middle">ERRORS + FIXTURES</text>
  <text class="small" x="602" y="237" text-anchor="middle">typed failure cases</text>

  <rect class="product" x="680" y="190" width="140" height="64" rx="6"/>
  <text class="head" x="750" y="216" text-anchor="middle">DOCS + DIFF</text>
  <text class="small" x="750" y="237" text-anchor="middle">compatibility</text>

  <path class="edge" d="M 122 254 L 122 292 L 430 292 L 430 314"/>
  <path class="edge" d="M 282 254 L 282 292 L 430 292"/>
  <path class="edge" d="M 442 254 L 442 314"/>
  <path class="edge" d="M 602 254 L 602 292 L 430 292"/>
  <path class="edge" d="M 750 254 L 750 292 L 430 292"/>

  <rect class="guard" x="270" y="314" width="320" height="72" rx="8"/>
  <text class="head" x="430" y="342" text-anchor="middle">CI GENERATION GUARD</text>
  <text class="label" x="430" y="364" text-anchor="middle">regenerate, diff, compatibility, conformance</text>
</svg>
