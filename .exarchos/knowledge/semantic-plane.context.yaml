# ─── drift (design vs built) and resolutions ─────────────────────────────────

drift:
  - id: "unit"
    design: "one capsule per workflow; 2 calls"
    built: "one delegate wave per prepare; transition separate; HSM is the protocol"
    resolution: "decided 2026-09-30: per-workflow target; per-wave recorded as interim (#1927)"
  - id: "vcs-effects"
    design: "runtime mutates Git/PR; WLM/lifecycle/serializer demoted explicitly"
    built: "serialize_merge per worktree on the normal path; setup_worktree; create_pr in synthesis-closeout"
    resolution: "decided 2026-09-30: demote all three; settle observes (#1928)"
  - id: "second-adapter"
    design: "second runtime"
    built: "-"
    resolution: "a 2026-09-30 proposal to make it 'the review intent' was WRONG and is withdrawn"
  - id: "settlement-vocabulary"
    design: "five outcomes; result status; partial settlement"
    built: "six outcome names: settled, rejected, deviation-pending, recompile-required, corrective-capsule and accepted-with-rationale, and settlement gives each of them. The three stored names stay: settled is the accepted of the design, deviation-pending is its decision-required, and rejected has no design name. rejected means a request or deviation error with nothing verified; an earlier build also gave it for a superseded claim and for a failed verification, and a replay returns such a receipt as stored. Partial settlement is built: a batch completes the tasks that pass, and a required task that the stream shows complete needs no claim. The result status is built on the claim: completed (the default), failed, blocked or skipped, with a reason unless completed. A claim that is not completed is never verified and never completes a task; its task is unresolved, and the batch is corrective-capsule. The permitted deviation of the design is built as a rationale on a completed claim, not as a deviation kind: it names a delegated decision of the capsule by id, takes no decision round and changes no gate, and a batch with no finding that records one is accepted-with-rationale. The status and the rationale are on the claim and in the bundle. The stream holds only the summary: unresolvedTasks and rationales on the execution.settled row. A claim that reports failed leaves no task.failed row, and tasks[].status does not change."
    resolution: "divergence loop C3 (#1926). Decided 2026-10-06: outcome names are additive, and a permitted deviation is a rationale on the claim. Open: settlement sets no limit on the corrections of one task; a reported failure writes no task.failed row; the classification of a prohibited change is drift row prohibited-detection."
  - id: "corrective-capsule-compiles-nothing"
    design: "a corrective outcome emits a corrective capsule (the settlement decision carries nextCapsule)"
    built: "corrective-capsule returns a list and compiles no capsule. The receipt carries unresolved (taskId, cause, and the failedLeaf and operationId of a halted segment) and the execution.settled row carries unresolvedTasks (taskId, cause). The correction is a new batch on the same capsule that claims only the unresolved tasks. The outcome keeps the name that the design gives it. The cause is verification-failed, task-failed, task-blocked or task-skipped, and only a halted segment has a failedLeaf and an operationId. The reason of an unresolved task is the message of its finding, on the receipt and in the bundle. prepare binds no such reason into a later capsule, so the coordinator carries it to the worker."
    resolution: "decided 2026-10-06 (#1926): settle does not compile, and only prepare compiles. Open: binding the reasons of unresolved tasks into the next capsule (knowledge binding leg, #1930)."
  - id: "prohibited-detection"
    design: "settlement classifies a change that breaks an invariant or an explicit boundary as prohibited, and it rejects the work or emits a corrective capsule"
    built: "settlement has no classifier of what changed. A prohibited change is found only by a gate that fails (the task is then unresolved), or by the worker, who reports a deviation or a status. A deviation of a kind outside the envelope rejects the batch as an escalation. A rationale cannot hide such a change from a gate, because it changes no gate, but nothing compares a recorded choice with the invariants."
    resolution: "unresolved, and deferred from the settlement vocabulary (#1926). The segment that settle runs for a task holds four gates (test adequacy, contract drift, mock boundary, static analysis) and no invariant gate. check_invariant_conformance runs at review, and its verdict-shaped result is #1976."
  - id: "knowledge"
    design: "C2 binds the smallest sufficient slice; workers never fetch design knowledge"
    built: "rationale statements for the whole capsule, and no per-task slice. The first is 'The design of record is <path>'. On a capsule at design version 2 or later, the accepted design changes follow it: one statement for each change (the deciding actor, the proposed change when one was given, the deviation statement), for at most eight changes, then one statement that counts the rest. prepare reads the changes from the settlement bundles of the revisions that the capsule binds. The settlement vocabulary did not change the binding: no capsule binds the reason of an unresolved task or a recorded delegated choice. The delegated decisions that a rationale names are the two of the built-in authority (implementation-approach and execution-order), the same for each task."
    resolution: "knowledge binding leg (#1930). The accepted changes landed with the material path (#1926, PR #2128)."
  - id: "state-document"
    design: ".state.json retired for the run manifest"
    built: "transition guards read the document; settle syncs it"
    resolution: "workflow-scoped capsule leg (#1927)"
  - id: "workers-on-mcp"
    design: "workers never call MCP"
    built: "agent-teams worker prompt calls exarchos_workflow get, exarchos_view tasks, exarchos_event append"
    resolution: "agent-teams mode is off-plane until re-designed (#1918)"
  - id: "ir-direction"
    design: "definitions are the source; HSM deleted"
    built: "lower-definition.ts derives a kernel FROM the HSM; guards dropped; custom workflows (exarchos.config.ts workflows:) not compilable"
    resolution: "workflow-scoped capsule leg (#1927, #1253 wave 1)"
  - id: "verification-scope"
    design: "settle validates evidence against pinned intent"
    built: "settle runs gates in the CLAIMED worktreePath, unchecked. The kill-probe base is frozen in the capsule (baseRef) and passed by settle (#1925); the other gates still default their base to main."
    resolution: "verification scope leg (#1929). The kill-probe base is resolved by #1925; the base of the other gates is the open question verification-base."
  - id: "gate-verdict-enforcement"
    design: "settle accepts a task only when the verification it runs passes"
    built: "a blocking gate that blocks fails its executor leaf, so settle leaves a task whose kill probe blocked unresolved (corrective-capsule since the settlement vocabulary, rejected before it). Gates with a verdict-shaped result (check_invariant_conformance, check_review_verdict) are not covered (#1976)."
    resolution: "#1943 resolved by #1975 (2026-10-01); verdict-shaped gates #1976 (v3.0.0)"
  - id: "measurement"
    design: "2-call acceptance metric per workflow"
    built: "census per intent (plan 8, delegation 6, task-completion 5, review 10, synthesis 7 at N=1)"
    resolution: "re-aim #1687"
  - id: "run-bundle-location"
    design: "repo-local .exarchos/runs/ (gitignored)"
    built: "under the workflow state dir"
    resolution: "open question"
  - id: "launcher"
    design: "retired for plugin distribution"
    built: "launcher shipped; v2.12.0 is the first release that carries the plane (the interim per-wave prepare/settle)"
    resolution: "distribution leg"
  - id: "materiality"
    design: "settlement classifies what changed: a changed assumption, goal interpretation or task boundary is material"
    built: "the deviation kind decides materiality, not a classification of what changed. An accepted invalidated-assumption is material and missing-context is not. The capsule pins the material kinds."
    resolution: "decided 2026-10-05 (#1926): the kind decides"
  - id: "design-version"
    design: "designVersion names the design that a capsule was compiled from"
    built: "the design version is a counter of the recorded revisions (design-v<N>, one step per design.revised row), on the capsule and in the prepare replay key. The bytes of the design record are not pinned."
    resolution: "unresolved; the material path (#1926) builds the counter only"
  - id: "revision-reach"
    design: "a material change recompiles the affected slice; partial settlement is valid"
    built: "the continuation prepare recompiles unfinished work only. Its slice is the unfinished tasks that the revision names and each unfinished task that waits on one of them, and the walk never passes through a finished task. A deviation names only unfinished tasks: a task outside the batch, or a task that the batch reports as failed, blocked or skipped (the own-task deviation). A deviation that names a finished task, or a task that its batch claims as completed, rejects the batch. A continuation announces no finished task and leaves no row for one. Rework is a new task. Partial settlement is built: a batch completes the tasks that pass, and the others are unresolved (corrective-capsule). After an accepted material deviation that names a blocked task of its batch, the round is corrective-capsule with a designRevision, and the continuation compiles that task. A batch that arrives on a capsule after a revision that names a claimed task or an unfinished required task is recompile-required, and nothing in it is verified. Three gaps stay open. settle does not compare affected slices for a revision that arrives while it adjudicates: the read of the later revisions is a check and not a lock. The decision round does not read the standing of the tasks that a held deviation names. Thus a second batch can complete such a task while the first batch is held, and the accepted decision then revises a finished task. task_complete reads no revision, so it can complete a task that a later revision names, and a batch on the earlier capsule then settles that task as already-complete."
    resolution: "partial settlement is built with the settlement vocabulary (divergence loop C3, #1926). Reopening finished work, the settlement-time comparison for a race, and the race on a held deviation are deferred behind verification scope (#1929), decided 2026-10-06."
  - id: "material-call-count"
    design: "3 calls for a workflow with a material deviation (2, plus the continuation prepare), and 3 for one with a required decision (2, plus a second settle that carries the decision)"
    built: "5 calls on the measured path of a material deviation with a human decision: prepare, settle (held), settle (the decision, which records design.revised), prepare (the continuation, which records capsule.recompiled), settle (the recompiled capsule). The static census counts it as the delegation exception material-revision: 5 Exarchos calls at N=1, with 2 runbook fetches counted apart. A material deviation always takes the decision round, because the envelope requires approval, and the recompiled capsule takes a settle of its own. The own-task path has the same 5 calls: the held batch reports a task as blocked and its deviation names that task, the decision round is corrective-capsule with a designRevision, and the continuation compiles the task. The count holds no landing call. A task that waits on an accepted task gets its worktree only after that task lands (Step 4 of the delegate skill, one serialize_merge call for each task), until the VCS demotion (#1928) moves landing to the harness. The census counts one delegate intent, not a workflow."
    resolution: "unresolved. The per-workflow measurement belongs to the workflow-scoped capsule leg (#1927) and the re-aim of #1687."
  - id: "exception-call-count"
    design: "2 Exarchos calls per normal workflow, 3 per exception path"
    built: "the static census counts the delegation paths at N=1, each to the settle that ends it, with 2 runbook fetches counted apart. The normal path to its settle is 2 calls (prepare, settle). corrective-capsule is 3 (prepare, settle, the settle of the correction). A rejected request is 3 and a held decision is 3. recompile-required is 4 (stale at entry: prepare, settle, prepare, settle). material-revision is 5 (a material deviation with a human decision). A batch that is accepted with rationale takes the normal 2 calls, because a permitted deviation takes no round. A task that its claim reports as failed, blocked or skipped takes the corrective path: 3 calls. A decision that leaves a task unresolved is 4: the decision path and then the correction. The task is unresolved after a failed verification, or because the held claim reports it as not completed (the own-task path with a deviation that is not material). That count is the sum of two census paths, and the census holds no exception for it. The own-task path with a material deviation is the material-revision path: 5 calls. Each further correction of one task is one more settle, and settlement sets no limit. The census counts one delegate intent, not a workflow."
    resolution: "unresolved, recorded as drift against 3 per exception path. The permitted path meets the design: 2 calls. Three paths exceed 3 by construction: a stale capsule needs a second prepare, a correction after a decision is a third settle, and a material deviation needs the decision round and the continuation. The per-workflow measurement belongs to the workflow-scoped capsule leg (#1927) and the re-aim of #1687."
  - id: "prepare-replay-key"
    design: "prepare is idempotent: a retry with unchanged inputs returns the recorded capsule"
    built: "the replay key gained the design version and the compiler version, so a prepare claim recorded before this upgrade no longer matches. A prepare retried across the upgrade compiles the next capsule version."
    resolution: "by construction: the compiler name is in the key so that a capsule of an earlier compiler is not replayed. A capsule that the earlier compiler stored is still found by its version."
  - id: "kill-probe-false-pass"
    design: "settle accepts a medium-tier or high-tier task only when the kill probe shows that a test of the task can fail"
    built: "'honest verdicts' runs the scoped tests on the task source first, and it reverts the source only after a green run. Only a red run after the revert is a kill. Exit 0 is green. Exit 1 is red, unless the built-in registry gives other red codes for the toolchain, such as 101 for cargo test. A red run on the task source gives baseline-red. A run with no verdict (an exit code that is not read, a signal, a timeout, an output overflow, a spawn error, no command) gives run-no-verdict, before or after the revert. Both block in enforce mode with a blocking severity, and both give the evidence verdict indeterminate. In audit mode or under a warning severity, the reply is a pass with a warning. The probe does not revert test files or test-support files. In this repository the probe runs the package script test:files, which runs each named file in its own vitest project and builds the binary of the tree for a tests/process file. Each probe run gets a scratch store."
    resolution: "resolved (#2062) with the limit of the decision of 2026-10-18. The probe reads each red run after the revert as a kill: a test that does not load because the revert removed or changed a module that it imports, such as a module that the task adds or renames, and a reverted config file, such as package.json, that makes the run red or collect no test. Limits found in the build: a .NET repository on Microsoft.Testing.Platform gets run-no-verdict and blocks, and a conftest.py that fails to load after the revert makes pytest exit 4 (run-no-verdict), both until 'no per-language code' (#1540). cargo test -- <path> and ctest -- <files> can give a green run that tests nothing (older than this change). Open, no owner: tests/outcome/onboard.test.ts runs dist/bin, and tests/acceptance/fresh-install.test.ts archives HEAD, so under the probe they do not see the reverted tree."
  - id: "completion-gate-row"
    design: "a task is complete only after the verification that its gate runs passes"
    built: "task.completed is reserved (2026-10-15), and 'honest verdicts' reserves gate.executed to the gate handlers: the generic append and the batch append refuse it, and the sidecar drain drops it. task_complete reads the latest runner row of the task (the runner source, the runner key gate.executed:<evidenceId> and details.taskId). The evidence record that the row cites must be an active passing static-analysis record of the task, and any other active record of the task that does not pass refuses. A row that names no task satisfies no task, and a later failing run wins over an earlier pass. In the segment that settle runs, the gate runs before the task_complete leaf, and a static-analysis verdict that blocks stops the segment. Three routes stay open. First, the record and the reader name no tree, so on the direct path a pass on another tree, such as the directory of the server, completes the task. Second, exarchos_workflow update or a generic state.patched append sets tasks[].status to complete with no gate run, and the transition guards and the prepare frontier read that field. Third, an earlier build that shares the store still accepts a generic append of gate.executed."
    resolution: "resolved in part (#1886 defect 2, the forged-row half): the decision of 2026-10-16 reserves gate.executed, and the decision of 2026-10-18 keeps one build for each store. Open: the wrong-tree half, owned by 'the capsule pins the scope' (#1929). The state-field route, owned by #1927 for the transition guards (the state document retires as a guard input) and by no issue for the prepare frontier."
  - id: "completion-row-consumers"
    design: "each consumer of a fact has a producer"
    built: "after task.completed was reserved (2026-10-15), two consumers of the row have no producer. The team.disbanded tally counts the completion rows that carry a teamId (src/events/tools.ts), and task_complete writes no teamId, so no new completion counts. Config hooks and the channel push keyed on task.completed run only from the event composite (src/events/composite.ts), and task_complete writes through the store, so they do not fire for it."
    resolution: "unresolved; no owner"
  - id: "completion-read-before-shape-pass"
    design: "a stream read that decides a settlement verdict is made or compared inside the commit of that verdict"
    built: "settle reads the completion rows once, before the shape pass, and that read decides findings: a required task with a row needs no claim, and a claim with a status for a complete task gives no finding. The settlement vocabulary moved the read ahead of the shape pass. The earlier build read it after the shape pass, under settled only, to choose the segments. After the segments, settle reads the rows again only for a task whose segment halted. A row that another call appends between the first read and the commit thus still gives a wrong record. A claim with a status lists that task as unresolved, and a required task with no claim gives missing-claim, so the batch is rejected."
    resolution: "unresolved; owned by #1929 (verification scope), with the settlement-time comparison for a race"
  - id: "store-version"
    design: "a stored shape that an earlier build cannot read comes with a store version step"
    built: "the settlement vocabulary changes the execution.settled row, the settlement bundle and the claim trace, and SCHEMA_VERSION stays 6. The upgrade from 2.12 to 3 is one-way and recorded (decision of 2026-10-15). The stored shapes have a digest and a version decision in tools/audit/registered-actions-snapshot.json, and a changed shape with no new decision fails a check."
    resolution: "decided 2026-10-15: no step for now. Follow-up: a step that only stamps the version, once the freshness gate of #2106 is repaired (no owner)."

