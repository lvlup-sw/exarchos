# ─── drift (design vs built) and resolutions ─────────────────────────────────

drift:
  - id: "unit"
    design: "one capsule per workflow; 2 calls"
    built: "one delegate wave per prepare; transition separate; HSM is the protocol"
    resolution: "decided 2026-09-30: per-workflow target; per-wave recorded as interim (#1927)"
  - id: "vcs-effects"
    design: "runtime mutates Git/PR; WLM/lifecycle/serializer demoted explicitly"
    built: "serialize_merge per worktree on the normal path; setup_worktree; create_pr in synthesis-closeout"
    resolution: "decided 2026-09-30: demote all three; settle observes (#1928)"
  - id: "second-adapter"
    design: "second runtime"
    built: "-"
    resolution: "a 2026-09-30 proposal to make it 'the review intent' was WRONG and is withdrawn"
  - id: "settlement-vocabulary"
    design: "five outcomes; result status; partial settlement"
    built: "SettlementOutcome = settled|rejected|deviation-pending; every required result must be claimed"
    resolution: "divergence loop C3 (#1926)"
  - id: "knowledge"
    design: "C2 binds the smallest sufficient slice; workers never fetch design knowledge"
    built: "one statement: 'The design of record is <path>'"
    resolution: "knowledge binding leg (#1930)"
  - id: "state-document"
    design: ".state.json retired for the run manifest"
    built: "transition guards read the document; settle syncs it"
    resolution: "workflow-scoped capsule leg (#1927)"
  - id: "workers-on-mcp"
    design: "workers never call MCP"
    built: "agent-teams worker prompt calls exarchos_workflow get, exarchos_view tasks, exarchos_event append"
    resolution: "agent-teams mode is off-plane until re-designed (#1918)"
  - id: "ir-direction"
    design: "definitions are the source; HSM deleted"
    built: "lower-definition.ts derives a kernel FROM the HSM; guards dropped; custom workflows (exarchos.config.ts workflows:) not compilable"
    resolution: "workflow-scoped capsule leg (#1927, #1253 wave 1)"
  - id: "verification-scope"
    design: "settle validates evidence against pinned intent"
    built: "settle runs gates in the CLAIMED worktreePath, unchecked; kill-probe base defaults to main (#1925)"
    resolution: "verification scope leg (#1929)"
  - id: "measurement"
    design: "2-call acceptance metric per workflow"
    built: "census per intent (plan 8, delegation 6, task-completion 5, review 10, synthesis 7 at N=1)"
    resolution: "re-aim #1687"
  - id: "run-bundle-location"
    design: "repo-local .exarchos/runs/ (gitignored)"
    built: "under the workflow state dir"
    resolution: "open question"
  - id: "launcher"
    design: "retired for plugin distribution"
