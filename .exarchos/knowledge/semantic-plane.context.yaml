      refs: "#1898 (reopened 2026-10-01), #1779, #1825"
    - leg: "distribution (plugin primary, launcher retired, installer pinned, a release that carries the plane)"
      status: "in progress: installers carry a built-in verifier and the release gate refuses an unpinned key (#1939); the publisher key is pinned and v2.12.0 is the first release with a signed manifest (#1737); v2.12.0 reached GitHub Releases but not npm, so v2.12.1 is the first GA on npm; the stranded bundle is archived (#1931); the launcher is not retired (#1877); since #2132 (2026-10-16) the npx skills install of a release build names its release tag, and a 2.12.1 binary installs the skills of the default branch until a 3.x binary replaces it"
      refs: "#1877, #1737, #1690, #1931 (stranded-bundle GA ports)"
    - leg: "transport (prepare/settle on the 2026-07-28 stateless MCP spec; long-running settle)"
