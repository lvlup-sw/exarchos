# ─── decisions (append only) ─────────────────────────────────────────────────

decisions:
  - date: "2026-08-27"
    source: "#1875"
    decision: "Adopt the plane as the Interaction Economy endpoint. Amend #1599 rules 3 and 7. Re-charter #1856 M3-M5 and #1258 kernel-first. Close #1766/#1767 and #1318 as superseded. Promote #1745. Propose launcher deprecation (#1877)."
  - date: "2026-08-29"
    source: "#1876"
    decision: "Event authority: Options 1+2 composed, staged additively. The fine-grained-events constraint is amended, not voided. Both vocabularies stay until the preconditions land. Migration: #1888, then #1898."
  - date: "2026-09-11"
    source: "strategos#193, #1903"
    decision: "Kernel published and consumed as @lvlup-sw/strategos-contracts 0.14.0."
  - date: "2026-09-14"
    source: "#1912 A1"
    decision: "settled does not move the phase; transition stays a separate call."
    status: "INTERIM since 2026-09-30 (see below)"
  - date: "2026-09-14"
    source: "#1912 A2 (#1915)"
    decision: "settle runs the executor's task-completion segment per accepted task. The tier comes from the capsule, never the claim. Cited evidence must resolve to recorded rows."
  - date: "2026-09-14"
    source: "#1912 A4 (#1919)"
    decision: "task.assigned promoted workflow-local -> capability; prepare and prepare_delegation append it; not reserved on the append surface."
  - date: "2026-09-15"
    source: "#1920 (in review)"
    decision: "One decision round per held batch covering every pending deviation; a decision carries no claims; deviationId is content-derived; a decided batch is closed."
  - date: "2026-09-30"
    source: "Reed, roadmap review session"
    decision: "The target unit is the WORKFLOW: one capsule, settlement carries phase change, transition and next_actions leave the agent path. Per-wave prepare and the separate transition are a recorded interim lowering."
  - date: "2026-09-30"
    source: "Reed, roadmap review session"
    decision: "Demote serialize_merge, setup_worktree and create_pr off the governance surface. The harness merges, creates worktrees and opens PRs. settle verifies by observation (branch ancestry, worktree identity, PR existence)."
  - date: "2026-09-30"
    source: "Reed, roadmap review session"
    decision: "Milestones are re-planned holistically against this reconciled design before any milestone moves. Issue revisions are drafted for review before they are applied."

  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "Milestone plan accepted. v2.12.0 = GA of what shipped (6 issues). v3.0.0 = the plane end to end, one milestone with 12 exit criteria. v3.1.0 renamed \"Portability and proof\". v3.2.0 = full DKG. #1604 (MCP 2026-07-28) stays on v3.0.0."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "No resume verb. The protocol has two verbs. Resuming is a read of the capsule and run bundle, followed by an idempotent settle."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "Exarchos carries no per-language code paths. Every verification command, flag and test glob comes from the repository through the toolchain resolver and is frozen into the capsule. The built-in toolchain table only seeds overridable defaults."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "No interim preview release. v2.12.0 GA ships when its six issues land; until then the plane is dogfooded from a locally built binary."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "Knowledge binding splits: an interim repo-local binder plus DKG P-0 (#1746), P-2 (#1747) and the ontology-criteria renegotiation (#1754) on v3.0.0; P-3 to P-5 on v3.2.0."
  - date: "2026-10-01"
    source: "delegated judgment, review session"
    decision: "The space invariant (INV-11) is held by the capsule capability manifest, coordinator-only MCP access, and settle observing worktree identity. The WLM is not a chokepoint. The space-moat fork (upstream hook standard, remote sandboxes) moves to v3.1.0."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "The context packet lives at .exarchos/knowledge/semantic-plane.context.yaml with a CLAUDE.md pointer."

  - date: "2026-10-01"
    source: "Reed, unmilestoned triage"
    decision: "The VCS demotion (#1928) covers every Git/PR write Exarchos performs (merge_orchestrate, merge_pr, add_pr_comment, create_issue), not only the three first named. #1898, #1913 and #1901 join v3.0.0; #1723 and #1724 join v3.1.0 with #1561. Eleven unmilestoned issues closed as done, superseded or duplicate."
