# Exarchos semantic workflow plane: context packet
#
# Read this before you plan, review or change anything that touches prepare,
# settle, capsules, phases, gates, events, knowledge binding, runtime adapters
# or the roadmap trackers. It replaces re-reading the two design documents and
# re-auditing the open issues.
#
# The packet has three kinds of content. Keep them apart:
#   design     what the adopted design says. Changes only through a recorded decision.
#   decisions  dated choices with a source. Append; never rewrite history.
#   measured   facts about the tree, each with an as_of and a command that re-checks it.
#              A measured fact older than the last merge to main is a hypothesis.
#
# Update protocol: when a leg lands or a decision is taken, edit `decisions`,
# `build_order`, `drift` and `issue_map` in the same PR, and bump `packet.as_of`.

packet:
  id: exarchos-semantic-plane
  version: 2
  as_of: 2026-10-01
  main_at: 413b4ffa0
  owner_issue: 1875            # the decision record and build-order log
  roadmap_issue: 1599
  epic_issue: 1856

sources:
  - id: plane
    title: Exarchos semantic workflow plane
    where: lvlup-sw/docs exarchos/docs/references/exarchos-semantic-workflow-plane.html
    commit: a11262f88
    role: the design. Protocol, capsule, settlement, divergence, knowledge, failure semantics.
  - id: transposition
    title: Semantic plane transposition (impact analysis)
    where: lvlup-sw/docs exarchos/docs/references/exarchos-semantic-plane-transposition.html
    commit: a11262f88
    role: where each existing machine lands, the kernel-first IR re-charter, the close-out ledger, the rule conflicts.
  - id: read-locally
    how: "gh api repos/lvlup-sw/docs/contents/exarchos/docs/references/<file> --jq .content | base64 -d   (or npm run docs:mount)"

# ─── design ──────────────────────────────────────────────────────────────────

design:
  thesis:
    - Meaning is authoritative. Exarchos owns workflow semantics, design intent, invariants and accepted knowledge.
    - Scheduling is delegated. The runtime owns concurrency, retries, prompts, model choice and aggregation.
    - Workers stay off MCP. One coordinator prepares and settles. Workers consume immutable task packets.
    - Drift becomes knowledge. Execution can propose a design change; only settlement can accept and version it.

  protocol:
    verbs:
      prepare: "prepare(intent, scope, capabilities) -> one immutable, content-addressed capsule. Resolves the workflow DEFINITION, binds knowledge, validates, partitions, lowers."
      settle: "settle(capsuleVersion, batch) -> one decision. Adjudicates claims and evidence against the pinned capsule. Idempotent on (capsuleVersion, batchId)."
    unit: the WORKFLOW. Not a phase, not a wave, not an intent.
    call_budget_per_workflow:
      conforming: 2
      permitted_deviation: 2
      material_deviation: 3      # + continuation prepare (affected-slice recompile)
      decision_required: 3       # + second settle carrying the decision
    execution_calls: 0           # workers never call Exarchos
    no_state_specific_verbs: true  # quote: "No state-specific verbs are required."
    optional: hybrid knowledge mode adds one batched supplement call by the coordinator.

  capsule:
    identity: [workflowId, definitionVersion, designVersion, capsuleVersion]
    intent: [goals, nonGoals, successCriteria]
    authority: [invariants, assumptions, delegatedDecisions, escalationBoundaries]   # plus goals = the five authority categories
    graph: [tasks, dependencies, joins, completionPredicate]
    contracts: [taskInputs, taskResults, evidenceKinds, deviationEnvelope]
    knowledge: [mode eager|hybrid, rationale, patterns, glossary, unresolvedRefs?, supplementBudget?]
    executionProfile: [capabilities, concurrencyHints?, preferredAgentKinds?]
    provenance: [sources, compiledAt, compilerVersion]
    stages: tasks, joins, the critic/review stage ("a logical capsule stage, not an Exarchos-owned agent") and synthesis boundaries all live INSIDE one capsule.
    envelopes: taskContext[] per worker (task, knowledge slice, result schema); reviewContext (acceptance rules, pinned knowledge refs).
    task_knowledge_slice: [taskId, "compiledFrom {designVersion, capsuleVersion}", mustPreserve, rationale, assumptions, delegatedChoices, escalationTriggers, evidenceRequested, sourceRefs]

  settlement:
    outcomes: [accepted, accepted-with-rationale, corrective-capsule, decision-required, recompile-required]   # plus nextCapsule
    task_result_status: [completed, blocked, skipped, failed]
    partial_settlement_valid: true   # Exarchos decides whether evidence supports completion or corrective work
    dispositions:
      conforming:
        changed: "nothing semantic"
        action: "accept"
        design: "keep vN"
        extra_calls: 0
      permitted:  {changed: implementation detail within delegated freedom, action: accept with rationale, design: keep vN, extra_calls: 0}
      material:   {changed: assumption, goal interpretation or task boundary, action: approve revision then recompile affected slice, design: create vN+1, extra_calls: 1}
      prohibited:
        changed: "invariant or explicit boundary"
        action: "reject or emit corrective capsule"
        design: "keep vN"
        extra_calls: 0
      ambiguous:  {changed: evidence cannot determine meaning, action: request human or policy decision, extra_calls: 1}
    classification_order: invariant breach -> prohibited; meaning changed -> material; delegated choice -> permitted; otherwise conforming; ambiguous only when evidence cannot decide.
    human_default: material design change requires a durable human decision (policy auto-acceptance may come later).

  ownership:   # who owns what. Git, filesystem and CI are external truth.
    rows:
      - concern: "workflow meaning"
        exarchos: "goals, phases, invariants, completion semantics"
        runtime: "consumes compiled meaning"
      - concern: "execution strategy"
        exarchos: "capability constraints and hints"
        runtime: "fan-out, pipelines, retries, model selection"
      - concern: "implementation state"
        exarchos: "references and interprets evidence"
        runtime: "reads and MUTATES through its tools"
        external: "Git / filesystem / CI"
      - concern: "design drift"
        exarchos: "classifies and accepts semantic change"
        runtime: "detects and proposes with evidence"
      - concern: "telemetry"
        exarchos: "coarse semantic events"
        runtime: "detailed run telemetry and journals"
    rule: "Exarchos compiles and never runs the body. Exarchos executes only the internals of prepare and settle."

  compiler: [C1 normalize, C2 bind knowledge, C3 validate, C4 partition, C5 lower adapter hints]

  ir:   # #1258 re-charter, transposition section 04, resolution B
    representations:
      definition: authored workflow meaning (interface; humans author it, Git reviews it)
      compiled_plan: definition + bound knowledge + repo facts + affected slices (internal to prepare)
      capsule: compiled plan + capsuleVersion + packets + settlementContract (interface; adapters consume it)
    resolution: "kernel-first. Freeze the kernel in Strategos.Contracts; generate TS and .NET types (a hand-written mirror is a defect); reserve combinator names as node kinds; harden #1249 laws only after the divergence loop runs on real settlements; #1253 in two waves (kernel parity with the first capsules, sugar parity after laws)."
    authoring: TypeScript Builder -> serialized definition in .exarchos/workflows/ -> prepare compiles it with no Exarchos code change. Like Bicep -> ARM JSON.
    without_it: 'The compiler becomes "a switch statement of built-in graphs", and settle needs bespoke logic per workflow type.'
    kernel_sketch: "WorkflowDefinition { identity{definitionId,version,contentHash}; tasks[]{taskId,kind,inputs,outputs,completion,capabilities}; edges[]{from,to,kind dependency|join}; authority{invariants,goals,assumptions,delegatedDecisions,escalationBoundaries} }"

  events:
    semantic_kinds: [workflow.prepared, execution.settled, deviation.proposed, deviation.decided, design.revised, capsule.recompiled]
    meaning:
      workflow.prepared: definition, design, compiler, capsule version, scope, semantic checks
      execution.settled: accepted outcomes, evidence summary, unresolved work, final decision
      deviation.proposed: invalidated assumption, observation, proposed change, risk, affected slice
      deviation.decided: accepted, rejected or deferred, with actor, rationale, policy reference
      design.revised: append-only design delta linking prior and next version
      capsule.recompiled: new capsule identity and the minimal invalidated slice
    rule: events carry hashes and paths, not payloads. No per-tool eventing; tool calls are runtime telemetry unless they become evidence.
    durable_record: a run bundle store (manifest, capsules, settlements, decisions, evidence index) indexed by the append-only ledger.

  knowledge:
    classes: [decision records, invariants, patterns, assumptions, glossary, learning candidates]
    rule: bind the smallest sufficient slice into the capsule; keep references to canonical records; never force workers to fetch design knowledge themselves.
    binder: the DKG (#1745) is promoted to a hot-path dependency of prepare (C2).

  failure_semantics:
    rows:
      - failure: "worker fails or returns null"
        runtime: "retry/substitute/mark blocked"
        exarchos: "nothing until settlement"
      - failure: "coordinator crashes before settle"
        runtime: "resume journal and rebuild batch"
        exarchos: "accept same batch idempotently"
      - failure: "worker lacks semantic context"
        runtime: "knowledge-gap request to coordinator"
        exarchos: "optional one pinned supplement"
      - failure: "duplicate settlement"
        exarchos: "return prior decision; append nothing"
      - failure: "design changes during execution"
        runtime: "continue on pinned capsule"
        exarchos: "compare affected slices at settlement"
      - failure: "evidence incomplete"
        runtime: "run a critic or targeted verifier"
        exarchos: "corrective packet or decision request"
      - failure: "runtime lacks a capability"
        runtime: "reject before fan-out"
        exarchos: "capability manifest checked in prepare"
    rule: "Runtime failures are not automatically governance failures. Transport is at least once; settlement is idempotent."

  non_goals: [per-tool eventing, a central scheduler, a hard security boundary (local authority guides cooperating runtimes)]
  kept_constraints:
    - Four visible tools stay four (prepare and settle are actions on exarchos_orchestrate).
    - No daemon. Every request is bounded.
    - Exarchos is an MCP server, never an MCP client.
    - History is append-only.
    - Human approval for material design change is the default.
    - No caller-authored generic batch. The batch is result submission against a typed settlement contract.

  adapters:
    meaning: a runtime adapter lowers the capsule into harness-native orchestration (the doc names Agent Factory and Claude dynamic workflows).
    second_adapter: a second RUNTIME, to prove the IR captured meaning and not one harness's mechanics. NOT a second intent or phase.
    capability_based: adapters advertise primitives (parallel map, durable step, structured result, human wait, cancellation).

