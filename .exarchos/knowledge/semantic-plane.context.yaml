# ─── open questions ──────────────────────────────────────────────────────────

open_questions:
  - id: design-authoring
    question: Where does design and plan authoring fit when the unit is one capsule per workflow? prepare binds design knowledge, so a design must exist first.
    candidate: a design stage whose accepted result is design.revised (v1); a continuation prepare then compiles the implementation slice. Roughly 4-5 calls per feature, not 2.
  - id: agent-teams
    question: Is agent-teams mode re-designed for the plane (no worker MCP, team.* events as runtime journal) or retired?
  - id: long-running-settle
    question: "settle runs test suites in worktrees inside one MCP request. How does that sit with the 2026-07-28 stateless spec and MCP Tasks (#1604, #1283)?"
  - id: dkg-taxonomy
    question: "The DKG depends on event-taxonomy-v2 issues that were never filed. Reconcile its claim events with #1876's six kinds instead of filing a second vocabulary?"
  - id: verification-base
    question: "Which base does each gate measure against? The per-task kill probe is decided: the integration base, frozen in the capsule (#1925). A breaking-change check may want the release base."
  - id: run-bundle-location
    question: Keep run bundles under the state dir, or move them to repo-local .exarchos/runs/ as designed?
  - id: boundary-scope
    question: "Which configuration owns the scope of the import-boundary check of static analysis: the ownership.firstParty globs of .exarchos.yml, which it reads now, or the config of dependency-cruiser? Does a PASS name the roots that it scanned? A source directory outside the roots of the globs, such as lib/ beside src/, is not scanned, and no report names it. The boundary check and the mock-boundary gate read the globs in two dialects."

