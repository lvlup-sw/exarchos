# ─── decisions (append only) ─────────────────────────────────────────────────

decisions:
  - date: "2026-08-27"
    source: "#1875"
    decision: "Adopt the plane as the Interaction Economy endpoint. Amend #1599 rules 3 and 7. Re-charter #1856 M3-M5 and #1258 kernel-first. Close #1766/#1767 and #1318 as superseded. Promote #1745. Propose launcher deprecation (#1877)."
  - date: "2026-08-29"
    source: "#1876"
    decision: "Event authority: Options 1+2 composed, staged additively. The fine-grained-events constraint is amended, not voided. Both vocabularies stay until the preconditions land. Migration: #1888, then #1898."
  - date: "2026-09-11"
    source: "strategos#193, #1903"
    decision: "Kernel published and consumed as @lvlup-sw/strategos-contracts 0.14.0."
  - date: "2026-09-14"
    source: "#1912 A1"
    decision: "settled does not move the phase; transition stays a separate call."
    status: "INTERIM since 2026-09-30 (see below)"
  - date: "2026-09-14"
    source: "#1912 A2 (#1915)"
    decision: "settle runs the executor's task-completion segment per accepted task. The tier comes from the capsule, never the claim. Cited evidence must resolve to recorded rows."
  - date: "2026-09-14"
    source: "#1912 A4 (#1919)"
    decision: "task.assigned promoted workflow-local -> capability; prepare and prepare_delegation append it; not reserved on the append surface."
  - date: "2026-09-15"
    source: "#1920"
    decision: "One decision round per held batch covering every pending deviation; a decision carries no claims; deviationId is content-derived; a decided batch is closed."
  - date: "2026-09-30"
    source: "Reed, roadmap review session"
    decision: "The target unit is the WORKFLOW: one capsule, settlement carries phase change, transition and next_actions leave the agent path. Per-wave prepare and the separate transition are a recorded interim lowering."
  - date: "2026-09-30"
    source: "Reed, roadmap review session"
    decision: "Demote serialize_merge, setup_worktree and create_pr off the governance surface. The harness merges, creates worktrees and opens PRs. settle verifies by observation (branch ancestry, worktree identity, PR existence)."
  - date: "2026-09-30"
    source: "Reed, roadmap review session"
    decision: "Milestones are re-planned holistically against this reconciled design before any milestone moves. Issue revisions are drafted for review before they are applied."

  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "Milestone plan accepted. v2.12.0 = GA of what shipped (6 issues). v3.0.0 = the plane end to end, one milestone with 12 exit criteria. v3.1.0 renamed \"Portability and proof\". v3.2.0 = full DKG. #1604 (MCP 2026-07-28) stays on v3.0.0."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "No resume verb. The protocol has two verbs. Resuming is a read of the capsule and run bundle, followed by an idempotent settle."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "Exarchos carries no per-language code paths. Every verification command, flag and test glob comes from the repository through the toolchain resolver and is frozen into the capsule. The built-in toolchain table only seeds overridable defaults."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "No interim preview release. v2.12.0 GA ships when its six issues land; until then the plane is dogfooded from a locally built binary."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "Knowledge binding splits: an interim repo-local binder plus DKG P-0 (#1746), P-2 (#1747) and the ontology-criteria renegotiation (#1754) on v3.0.0; P-3 to P-5 on v3.2.0."
  - date: "2026-10-01"
    source: "delegated judgment, review session"
    decision: "The space invariant (INV-11) is held by the capsule capability manifest, coordinator-only MCP access, and settle observing worktree identity. The WLM is not a chokepoint. The space-moat fork (upstream hook standard, remote sandboxes) moves to v3.1.0."
  - date: "2026-10-01"
    source: "Reed, review page"
    decision: "The context packet lives at .exarchos/knowledge/semantic-plane.context.yaml with a CLAUDE.md pointer."

  - date: "2026-10-01"
    source: "Reed, unmilestoned triage"
    decision: "The VCS demotion (#1928) covers every Git/PR write Exarchos performs (merge_orchestrate, merge_pr, add_pr_comment, create_issue), not only the three first named. #1898, #1913 and #1901 join v3.0.0; #1723 and #1724 join v3.1.0 with #1561. Eleven unmilestoned issues closed as done, superseded or duplicate."

  - date: "2026-10-01"
    source: "#1925 (approved design; first slice of #1929)"
    decision: "The kill-probe base is a term of settlement, like the tier. prepare freezes it per task as settlementContract.taskVerification[taskId].baseRef, read from synthesis.integrationBranch, and refuses BASE_UNRESOLVED when none (or no safe ref) is recorded. The base is a replay input. A capsule holds only the ready frontier, the pending tasks whose blockers are all complete; with none ready, prepare refuses NO_READY_TASKS and names the blockers. The gate never guesses: a missing base is the verdict base-missing, which always blocks and is checked after the policy skip. The merge base is resolved once, as a SHA, for both the diff and the revert. Review reads the verdict settle recorded instead of running the probe again."
  - date: "2026-10-01"
    source: "#1925, coordinator"
    decision: "The task-completion intent argument is baseRef, not baseBranch. The intent compiler hands an argument to every leaf whose schema declares that key, so baseBranch would also reach check_contract_drift, check_mock_boundary and check_static_analysis. Only the kill-probe step binds it (baseBranch: '<baseRef>'); the other gates keep their defaults while verification-base stays open. prepare_delegation returns the base as baseBranch, the name of the branch on the primitive path."
  - date: "2026-10-02"
    source: "Reed, release session"
    decision: "v2.12.0's npm publish failed because the repo .npmrc maps the @lvlup-sw scope to GitHub Packages, and a scope registry outranks publishConfig.registry. Cut v2.12.1 with the fix rather than hand-publish 2.12.0, so npm latest is a CI build with provenance. v2.12.0 stays a GitHub-only release."

  - date: "2026-10-05"
    source: "#1926 (material path, approved design)"
    decision: "A second, ordinary prepare recompiles. settle does not compile, and its outcome vocabulary does not grow in this slice: SettlementOutcome stays settled | rejected | deviation-pending. settle records an accepted material deviation as design.revised. The design version is a compilation input of prepare, so the next prepare compiles the next capsule version."
  - date: "2026-10-05"
    source: "#1926 (material path, approved design)"
    decision: "The deviation kind decides materiality. An accepted invalidated-assumption is a material design change, and missing-context is not. The capsule pins which kinds are material (contracts.deviationEnvelope.materialDeviationKinds), so settle reads them from the capsule that judges the batch and never from the current compiler."
  - date: "2026-10-05"
    source: "#1926 (material path, approved design)"
    decision: "A revision names only unfinished tasks. Finished work survives a revision by construction. Rework of finished work is planned as a new task, and the deviation names that new task. Nothing is reopened."
  - date: "2026-10-05"
    source: "#1926, plan review"
    decision: "Withdrawn: an earlier choice to reopen finished tasks, with a new guard on the move to review. A reopened task whose redo changes no test cannot pass the kill probe, and the guard it needed has a second representation in the admission layer."
    status: "WITHDRAWN 2026-10-05; the decision above replaces it (rework is a new task)"

  - date: "2026-10-06"
    source: "Reed (#1926, settlement vocabulary, approved design)"
    decision: "A permitted deviation is a rationale on the claim. The rationale names one of the delegated decisions of the capsule. It takes no human round, and every gate still runs."
  - date: "2026-10-06"
    source: "Reed (#1926, settlement vocabulary, approved design)"
    decision: "settle returns the list of unresolved tasks and does not compile. A correction is a new batch under the same capsule that claims only the unresolved tasks. Only prepare compiles."
  - date: "2026-10-06"
    source: "#1926, plan review"
    decision: "Outcome names are additive. Stored rows, bundles and replayed claims keep the three names settled, rejected and deviation-pending, and they still parse. settled is the accepted of the design, deviation-pending is its decision-required, and rejected has no design name. The slice adds no event kind, no capsule field, no compiler version and no change to prepare."
  - date: "2026-10-06"
    source: "#1926, plan review"
    decision: "recompile-required means one thing: the capsule was stale when the batch arrived, and nothing was verified."
  - date: "2026-10-06"
    source: "#1926, plan review"
    decision: "Reopening finished work stays out of the settlement vocabulary. It waits behind verification scope (#1929), with the comparison of affected slices at settlement time for a race."

  - date: "2026-10-15"
    source: "Reed (#1926, settlement vocabulary, verification review)"
    decision: "task.completed is reserved to its gated writers: task_complete, called directly or as the last leaf of the segment that settle runs. The generic append and batch append refuse it with RESERVED_EVENT_TYPE, as they refuse the other reserved types. The drain of the hook-event sidecar files appends no row of a reserved type. A recorded completion is the result of a required task, so a required task with a completion row needs no claim and no second verification. Nothing is reopened (#1929)."
    known: "Owned by #1929. task_complete reads no design revision. A task that a later revision names can still be completed by task_complete, and a batch on the earlier capsule then settles that task as already-complete. Owned by #1886 (a child of #1929): task_complete accepts a gate.executed row that the generic append can write, so the reservation does not prove that a gate ran. Drift row completion-gate-row."
    status: "known updated 2026-10-20: the gate.executed half is resolved in part. The generic append refuses gate.executed, and task_complete reads only the runner row of the task and its evidence record. A pass on another tree and a write of tasks[].status stay open (drift row completion-gate-row)."

  - date: "2026-10-15"
    source: "Reed (#1926, settlement vocabulary, verification review)"
    decision: "A halted segment records what the stream holds. After the segments, settle reads the completion rows again. A claimed task whose segment halted and whose row exists is complete: settle brings the document level for it and lists it as already-complete. A halt that is not a gate verdict fails the call with no verdict: a halt at the completion leaf, at a leaf that the runbook does not name, or on a broken leaf contract. Only a halt at a gate leaf gives verification-failed. Each STATE_SYNC_FAILED text names exarchos_workflow reconcile, then the retry, then a stop rule."
    known: "The executor keeps the record of a halted segment. A retry of the same batch thus gets the recorded halt again, unless the stream then records the task complete, so the refusal sends the claims to a new batchId once, and to a person if the same halt comes back. A gate leaf that does not run to a verdict (admission refused, no handler, a handler error) still gives verification-failed, because the receipt does not carry the failure as a value. A static-analysis gate that skips (no toolchain) does not halt the segment, so task_complete refuses with GATE_NOT_PASSED at the completion leaf. That halt takes the refused arm, a retry of the same batch replays it, and a new batch gets it again. A version gap in the stored document fails each retry, and the fix in the store is not decided."

  - date: "2026-10-15"
    source: "#1926, settlement vocabulary, verification review"
    decision: "\"A replay appends nothing\" means that the settle action appends no row. The dispatcher still records its telemetry rows for a replayed call under the shipped telemetry default. Those rows are older than the settlement vocabulary and are by design."

  - date: "2026-10-15"
    source: "Reed (#1926, settlement vocabulary, verification review)"
    decision: "No SCHEMA_VERSION step for the settlement vocabulary. The store stays at version 6, and the upgrade from 2.12 to 3 is one-way: it is recorded in the CHANGELOG operator notes and as the first version decision of the stored shapes (tools/audit/registered-actions-snapshot.json, storedShapes). A change of a stored settlement shape with no new version decision fails tests/architecture/identifier-stability.test.ts. Merge order: the npx skills install names the release tag of the binary, and both pull requests merge when they are green."
    known: "After this build settles a batch, a 2.12.x binary cannot read the settlement records of that workflow: it gives false refusals and INTERNAL_ERROR. Downgrade is not supported. The retry of a 2.12.x batch whose request repeated a deviation, or held more than sixteen deviations, does not replay its verdict, and the decision of such a held batch still works. A 2.12.1 binary has no ref in its install command, so it installs the skills of the default branch until a 3.x binary replaces it. Follow-up: raise SCHEMA_VERSION with a step that only stamps the version, once the freshness gate of #2106 is repaired."

  - date: "2026-10-16"
    source: "Reed (#1926, settlement vocabulary, merge)"
    decision: "The settlement vocabulary lands without a repair of the gate.executed row. A generic gate.executed append and one task_complete call still complete a task with no gate run. The repair stays with #1886 (drift row completion-gate-row)."
  - date: "2026-10-16"
    source: "Reed, roadmap check after the C3 merge"
    decision: "Verification scope (#1929) is the next leg. It owns the items that the settlement vocabulary deferred (reopening finished work, the race at settlement time, #1886), and the per-task coordinates that #1927 and #1928 read."
  - date: "2026-10-16"
    source: "Reed, plan of verification scope (#1929)"
    decision: "Verification scope is built in four slices, by name: 'honest verdicts', 'settlement reads inside its commit', 'the capsule pins the scope' and 'no per-language code'. build_order lists the issues of each. 'Honest verdicts' is built with Workflow runs and a /verify-code pass before each pull request, and with no Exarchos call. From 'settlement reads inside its commit' on, the build dogfoods prepare and settle on a binary built from main."
  - date: "2026-10-16"
    source: "Reed, plan of verification scope (#1929, #1886)"
    decision: "The repair of #1886 reserves gate.executed to the gate handlers. The generic append and the batch append refuse the type, and the drain of the hook-event sidecar files drops it. task_complete reads only the runner row of the task and the evidence record that the row cites. This replaces the earlier direction of #1886, a new row that the producer mints."
  - date: "2026-10-16"
    source: "Reed, plan of verification scope (#1929)"
    decision: "A decision round whose deviation names a finished task is refused: deviation-names-finished-task applies on the decision round too (the refuse class, rejected, nothing verified, no revision recorded). The slice 'settlement reads inside its commit' builds it."
  - date: "2026-10-17"
    source: "Reed, plan of verification scope (#1929)"
    decision: "A repository with no supported static-analysis toolchain fails closed, and the CHANGELOG says so. task_complete and settle refuse, so such a repository records no task.completed row until static analysis can run configured commands (#1540, the slice 'no per-language code')."
  - date: "2026-10-17"
    source: "Reed, plan of verification scope (#1929, #2062)"
    decision: "The kill probe runs a package.json script named test:files when it exists, as <pm> run test:files -- <files>. The package-manager profiles of the resolver carry the script name, so no .exarchos.yml key is added, and a 2.12.1 server still loads the config of this repository. The script comes first, also when .exarchos.yml sets test. Without the script, the probe runs the resolved test command with -- <files>. This repository adds the script, which runs each named file in its own vitest project. A general config key comes with 'no per-language code' (#1540)."
  - date: "2026-10-17"
    source: "Reed, plan of verification scope (#1929, #1721)"
    decision: "A boundary check of static analysis that cannot finish is a visible skip, marked degraded, and it does not fail the gate. This is the rule for a missing tool. The check scans only the roots of the ownership.firstParty globs, not the whole checkout."
    known: "The answer of 2026-10-18 on the boundary check narrows 'cannot finish' to a fault outside the repository. A broken config or a usage error fails the check."
  - date: "2026-10-18"
    source: "Reed, verification of honest verdicts (#1929)"
    decision: "A refused completion names its cause and the recovery of that cause: no runner verdict for the task, a latest verdict that failed, or a skip and the check that skipped. The recovery runs check_static_analysis with taskId, repoRoot 'auto' and worktreePath. For a skip, it first adds the missing scripts."
  - date: "2026-10-18"
    source: "Reed, verification of honest verdicts (#1929)"
    decision: "One Exarchos build for each store. task_complete reads only a runner row under the runner key gate.executed:<evidenceId>, so a copy without the key completes nothing. An earlier build that shares the store still accepts a generic append of gate.executed. Thus every MCP registration, the PATH binary that the hooks run and the CLI start the main build before 'settlement reads inside its commit', and every session restarts after a binary change. The CHANGELOG states the rule."
    known: "A human control: no row names the build that wrote it. Follow-up (no owner): a stamp of the build on the evidence record, and a reader that refuses a record of another build. The stamp is the build commit, not a hand-bumped epoch (decided 2026-10-20)."
  - date: "2026-10-18"
    source: "Reed, verification of honest verdicts (#1929, #1886)"
    decision: "'Honest verdicts' lands the forged-row half of #1886 defect 2: no generic append, and a runner row and evidence for the task. The wrong-tree half stays open on the direct path and closes in 'the capsule pins the scope'. The answer calls that slice 'slice 3', its number in the plan. The tracker draft, the pull request and the CHANGELOG say so."
  - date: "2026-10-18"
    source: "Reed, verification of honest verdicts (#1929, #1886, #1813)"
    decision: "'Honest verdicts' merges with #1886 defect 1 (a disabled gate in the config is not honored) and #1813 recorded as open and owned by 'the capsule pins the scope'."
  - date: "2026-10-18"
    source: "Reed, verification of honest verdicts (#1929)"
    decision: "Evidence before the pull requests: one blocking case in tests/core/process for the packaged chain (the generic append refused, then check_static_analysis with taskId, then task_complete). At the final tip, the boundary runs again with the binary of the branch first on PATH, and a few commits of the branch replay as probe tasks in a scratch clone of the repository."
  - date: "2026-10-18"
    source: "Reed, verification of honest verdicts (#1929, #2062)"
    decision: "What a kill means. The probe does not revert the files under the test roots: the test files and the test-support files, from a seed table that a later change makes configurable. A load failure of reverted source still counts as a kill, and the text of the probe states that limit. A run that does not finish (a timeout, a signal, no command) is indeterminate, never a kill."
  - date: "2026-10-18"
    source: "Reed, verification of honest verdicts (#1929, #2062)"
    decision: "When the files of the probe hold a tests/process file, the test:files script of this repository builds the binary of the working tree into a temporary directory and puts it first on PATH. Thus the run before the revert and the run after it both test the tree that the probe sees, not the installed binary."
    known: "The decision names tests/process files only. tests/outcome/onboard.test.ts runs dist/bin with no rebuild, and tests/acceptance/fresh-install.test.ts archives HEAD, so under the probe they do not see the reverted tree (no owner)."
  - date: "2026-10-18"
    source: "Reed, verification of honest verdicts (#1929, #1721)"
    decision: "What a boundary check with no verdict means. Only a fault outside the repository (out of memory, a signal, the output limit, a missing tool) is a visible skip marked degraded. A broken config or a usage error fails the check. A scan that checked no module is a degraded skip. The degraded mark and its causes go into the durable rows, so settle and other readers see them."
    known: "The decision of 2026-10-20 on the durable completeness mark names the rows: the gate.executed details and the settle verification trace. The taint check of static analysis follows the same rule: a ruleset or a usage error fails it, and a fault outside the repository is a degraded skip."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929, #1918): 'Proceed with recommendations'"
    decision: "Calls under that authorization. The agent-teams texts that write tasks[].status keep the write as an exception row of the completion-text census, owner #1918, because agent-teams mode is off-plane until re-designed. A refused completion names both routes: call task_complete again, or settle the claim under a new batch id. A recovery of the CHANGELOG that no shipped surface can carry is a register entry of the recovery check (tests/architecture/operator-recovery-carriers.test.ts), with an owner and a reason. Each list that is a deliberate subset says so in place, with its reason, and a guard over every such list is a follow-up. 'Honest verdicts' merges as one stack of three pull requests, each fix in the pull request whose code it changes, when CI and CodeRabbit are green."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929, #2062): 'Proceed with recommendations', the exit rule of the probe runner"
    decision: "Exit 0 of a scoped test run is green and exit 1 is red. Any other exit, a signal, a timeout, a spawn error or no command is no verdict: the indeterminate cause run-no-verdict, which blocks and is never a kill. An unknown code blocks. A toolchain whose failure code is not 1, such as cargo test with 101, gets a seed row in the built-in registry now. 'No per-language code' (#1540) makes the codes configurable."
    known: "The build seeds 101 for cargo test, 8 for ctest, and 1 and 2 for pytest, dotnet test, mix test and composer test. Only the command that the detection of a toolchain gives gets its codes. Limits found in the build: on Microsoft.Testing.Platform, dotnet test -- <file> exits 5 on green and red source alike, so the probe blocks with run-no-verdict until #1540. A conftest.py that fails to load after the revert makes pytest exit 4, which is run-no-verdict."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929, #2062): 'Proceed with recommendations', the rows of the test-support table"
    decision: "The rows are directory segments. A non-test file with a path segment named tests, test, __tests__, __mocks__, __fixtures__, fixtures or test-helpers is test support, and the probe does not revert it. 'No per-language code' (#1540) makes the table overridable."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929, #2062): 'Proceed with recommendations', the citations of the shipped skills"
    decision: "The test:files paragraph moves out of content/_shared, which the renderer does not ship, into a rendered reference of the delegate skill (references/testing-patterns.md). This keeps the decision that content/_shared is not shipped. A check requires each @skills citation of a shipped file to resolve in the skill tree of each runtime (tests/architecture/shipped-skill-citations.test.ts). Each older dangling citation is a register entry of that check, with an owner."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929): 'Proceed with recommendations', the durable completeness mark"
    decision: "The completeness mark of a gate verdict goes into the gate.executed details and into the settle verification trace. The strict field of the evidence record waits for the next store version step, with the repair of #2106 (a follow-up)."
    known: "Built in part with the kill probe. The carrier of check_test_adequacy states its verdict and its completeness, and the runner copies the completeness into the gate.executed details. The mark of static analysis and the settle verification trace come with the boundary check of static analysis."
    status: "built in full with the boundary check of static analysis. The carrier of check_static_analysis states verdict and completeness, and a degraded carrier names each advisory check with no verdict and its cause. The runner copies completeness and advisorySkips into the gate.executed details. The verification trace on the settle receipt lists in qualifiers each gate of the segment whose row is degraded or a skip, except a skip by the verification policy. The settlement bundle keeps its strict trace schema and gets no qualifiers, so no stored shape changes."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929, #1721): 'Proceed with recommendations', the binary of the boundary check"
    decision: "The boundary check runs the node_modules/.bin/depcruise that the repository installed, found from the repository root up as npm finds it, and never npx. No local binary is a missing tool: a visible degraded skip whose cause names the missing binary and the remedy. Nothing is fetched from the registry."
    known: "Other npx spawns in the source are older than this change. A lint rule over the argument lists of every gate spawn is a follow-up (no owner)."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929, #1721): 'Proceed with recommendations', a config that does not load"
    decision: "An .exarchos.yml that does not load or cannot be read fails the boundary check, by the rule of 2026-10-18 for a broken config. The report names the file and the error, and the check does not scan the default roots in its place. A repository with no boundary config has no check to fail."
    known: "The gate modules under src/verbs/gates read the config through loadExarchosConfigOutcome, and a lint rule bans the throwing loader there. The mock-boundary gate keeps its defaults for such a file and names the error in configLoadError. Readers outside src/verbs/gates are not under the rule (no owner). Which configuration owns the scope of the check stays open (open question boundary-scope)."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929): 'Proceed with recommendations', deliberate subsets"
    decision: "Each list that is a deliberate subset marks itself in place, with its reason."
    known: "In 'honest verdicts' the marked lists are the exception rows of the completion-text census, the register of the recovery check, the register of the shipped-citation check, the test-support table of the probe, the store keys of the probe environment and the floor of known wrappers of the worker-loop scanner. The guard over every such list (a meta-rule) is a follow-up, open with no owner."
  - date: "2026-10-20"
    source: "Reed, verification of honest verdicts (#1929): 'Proceed with recommendations', the build stamp"
    decision: "A stamp that names the build of a stored record is the build commit, not a hand-bumped epoch."
    known: "Not built. The stamp on the evidence record and a check that refuses a record of another build are a follow-up, open with no owner. Until then, one build for each store is a human control (decision of 2026-10-18)."
  - date: "2026-10-21"
    source: "Reed, backlog triage of the 273 open issues: 'Both passes, about 40-50 open', 'Trackers plus scheduled work', 'Ensure we lose no signal but are simply reducing administrative friction'"
    decision: "An issue stays open only when it is a tracker (a leg, or an epic that still owns open work), a decision or roadmap record (#1875, #1599), or scheduled work of the current leg. Every other item is one checklist line in one tracker. Its issue closes as not planned with the label tracked-in-checklist, and it keeps its detail, labels and milestone. A line that grows into design work reopens its issue. A sweep files one tracker with a line for each finding, not one issue for each finding."
    known: "Two read-only passes judged each issue against main 79f59577a, and Reed approved the plan as proposed. 20 issues closed as fixed, superseded or duplicate. A duplicate's unique detail was copied to its survivor first. 226 issues became lines in 26 trackers, 10 of them new (issue_map.backlog_trackers). A defect closed as superseded is a line under 'Closed as superseded by this leg' in #1927, #1928 or #1877, so the leg confirms that the code is gone. Milestones stay on the closed issues, so a milestone percentage counts a folded line as closed: count open work by tracker lines. #1460 and #1461 (Azure runner configuration) stay open for Reed."
# ─── build order (reconciled 2026-09-30) ─────────────────────────────────────

build_order:
  original: "kernel -> capsule contract -> prepare/settle -> one runtime adapter -> divergence loop -> #1249 laws -> second adapter"
  legs:
    - leg: "kernel"
      status: "done"
      refs: "strategos#193, #1903"
    - leg: "capsule contract"
      status: "done"
      refs: "#1905"
    - leg: "prepare/settle"
      status: "done as interim (one feature delegate wave)"
      refs: "#1906, #1908, #1910"
    - leg: "first runtime adapter (Claude Code delegation)"
      status: "done"
      refs: "#1912: #1914, #1915, #1917, #1919"
    - leg: "divergence loop C1 (decision round)"
      status: "done"
      refs: "#1920"
    - leg: "divergence loop C2 (material path: design.revised, capsule.recompiled, continuation prepare)"
      status: "done. First half: materiality pinned in the capsule (materialDeviationKinds); affectedTasks and proposedChange on a deviation; design.revised with settle as its emitter; the design version counter on the capsule and in the prepare replay key; the claim-superseded-by-revision finding; the capped receipt core. Second half: the continuation prepare, which is the first prepare after a design revision and commits capsule.recompiled ahead of its workflow.prepared record; the recompiled slice on its receipt (recompile: the unfinished tasks that the revision names and each unfinished task that waits on one of them); the accepted changes bound as knowledge (knowledge.rationale) on every capsule at design version 2 or later; the REVISION_UNREADABLE refusal of prepare when the settlement bundle of a bound revision cannot be read. Not in this leg: partial settlement, which is C3. Reopening finished work is deferred behind verification scope (#1929)."
      refs: "#1926; landed on main 2026-10-06 in PRs #2125, #2126, #2127 and #2128"
    - leg: "divergence loop C3 (settlement vocabulary: permitted, corrective-capsule, recompile-required, partial settlement with result status)"
      status: "done, in two halves and a third pull request with the fixes of the verification pass. First half, partial settlement: each finding kind has one class (stale, refuse, hold or unresolved), and the class first in precedence decides the outcome; six outcome names from one tuple that feeds the row, the bundle and the receipt; corrective-capsule, where a failed verification leaves its task unresolved and the tasks that pass are complete; recompile-required, where a later revision names a claimed task or an unfinished required task and nothing is verified; a recorded completion satisfies a required result, so a correction claims only the unresolved tasks; the list of unresolved tasks on the receipt (unresolved) and on the execution.settled row (unresolvedTasks), which the capped summary counts. Second half, result status and rationale: one claim codec that the request reader, the bundle and the decision round share, so a claim field survives the decision round; a status on the claim (completed by default, or failed, blocked or skipped with a reason of at most 280 characters), where a claim that is not completed carries no fields, no evidence and no rationale, is never verified, never completes a task, and gives the finding task-failed, task-blocked or task-skipped of the unresolved class; a deviation that names a task of its own batch when the claim reports that task as not completed, so that an accepted material decision gives corrective-capsule with a designRevision, and a later batch on that capsule is recompile-required; a rationale on a completed claim (at most four entries, each with the id of a delegated decision of the capsule and a statement of at most 280 characters), where an id that the capsule does not list gives the finding rationale-not-delegated of the refuse class; the accepted-with-rationale outcome for a batch with no finding in which an accepted claim records a choice; the optional rationales field on the execution.settled row (the task and the decision id), while the bundle keeps the statements. A completed claim with no rationale keeps the normal form of the earlier build, so the request digests, the deviation ids and the stored bytes of recorded batches do not move. The leg added no event kind, no capsule field, no compiler version and no change to prepare. The verification pass added: task.completed reserved to its gated writers; the completion rows read again after the segments, with a halt that is not a gate verdict refused; a digest and a version decision for each stored settlement shape; a skills install that names the release tag of a release build."
      refs: "#1926; landed on main 2026-10-16 in PRs #2130, #2131 and #2132 (one stack merge, main b6e339fd9). The build made no Exarchos call, so it is not a real settlement of the loop."
      deferred: "reopening finished work and the settlement-time comparison for a race (#1929); the race where a second batch finishes a task that a held deviation names, so that the accepted decision revises a finished task, because the decision round does not read the standing of the named tasks (#1929); the completion read that moved ahead of the shape pass, drift row completion-read-before-shape-pass (#1929); quarantine (no owner); a deferred decision (no owner); a detector for a prohibited change, which today is found only by the gates and by the report of the worker (no owner); binding the reasons of unresolved tasks into the next capsule (#1930); a limit on the number of corrections of one task (no owner); a task.failed row for a claim that reports failed, because the status is on the claim and in the bundle, and tasks[].status does not change (no owner); a SCHEMA_VERSION step, after the freshness gate of #2106 is repaired (no owner)"
    - leg: "conformance: verification scope (per-task repoRoot, worktreePath, baseRef in the capsule; worktree identity checked)"
      status: "in progress, and the next leg (decision of 2026-10-16). #1925 landed via #1974 (the kill-probe base, frozen in the capsule). The plan of 2026-10-16 cuts the rest into four slices, by name. 'Honest verdicts' (no capsule change) is built and verified: the forged-row half of #1886 defect 2, #2062 and the first half of #1721. It lands in a stack of three pull requests (the reserved gate.executed row and the task_complete reader, then the kill probe, then the boundary check of static analysis): #2135, #2136 and #2137. 'Settlement reads inside its commit' (no capsule change) is next: drift row completion-read-before-shape-pass and the race at settlement time. 'The capsule pins the scope' (exarchos-prepare-4): the per-task scope in the capsule and the worktree identity check (#1526), with the wrong-tree half of #1886 defect 2, #1886 defect 1, #1813 and #1753. 'No per-language code': #1540 and #1814."
      refs: "#1929 (children #1925, #1526, #1753, #1813, #1814, #1540, #1886, #1721); gate verdict enforcement #1943 (done, #1975)"
    - leg: "conformance: VCS demotion (serialize_merge, setup_worktree, create_pr off the governance surface)"
      status: "decided"
      refs: "#1928 (every Git/PR write; related #1884, #1835)"
    - leg: "conformance: workflow-scoped capsule (definitions first; whole workflow per capsule; settlement carries phase; next_actions, playbooks, state document retire)"
      status: "decided"
      refs: "#1927 (vehicle #1253; #1258, #1248, #1250, #1251, #1254)"
    - leg: "conformance: knowledge binding C2 (interim repo-local binder; DKG hot path)"
      status: "not started"
      refs: "#1930 (#1745, #1746, #1747, #1754)"
    - leg: "event authority remainder"
