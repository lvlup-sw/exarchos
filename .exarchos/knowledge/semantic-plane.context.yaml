# ─── traps that misled earlier sessions ──────────────────────────────────────

traps:
  - The call budget is per WORKFLOW. A per-intent or per-phase count is not the acceptance metric.
  - '"Second adapter" means a second runtime. Covering more phases comes from the workflow-scoped capsule, not from adapters.'
  - lower-definition.ts runs the intended direction backwards. It derives the kernel from the HSM; the HSM is supposed to be derived from definitions, then deleted.
  - '"Exarchos never runs the body" does not forbid settle from running verification gates. Those are settle internals, carried from the executor engine. It does forbid Exarchos merging branches or opening PRs.'
  - Retired is not deleted. A retired machine stays until its replacement passes the acceptance gate; retirement is recorded first, deleted second.
  - 'A closing keyword in prose closes the whole issue: "closes #1898 item 4" closed the tracker #1898. Write "lands #N item 4".'
  - A re-charter block at the top of an issue does not cancel contradicting sections below it. The description is the source of truth; strike the stale sections.
  - The state document is not an existence signal (rehydrate/get _meta.workflowExists is), yet transition guards read it. Both are true until it retires.
  - Issues that say "closes via the feat/v2-12-bundle PR" are not closed by anything; that branch cannot merge.
  - "A closed issue with the label tracked-in-checklist is open work. Its unticked line in a tracker is the open item, and a milestone percentage counts it as closed. Count open work by tracker lines, not by open issues."
  - A scope registry in .npmrc outranks publishConfig.registry. Publishing a scoped package needs the scope key in publishConfig too; tests/scripts/npm-publish-target.test.ts holds it.
  - "The static census counts what skills prescribe, not what agents do. The observed half of #1687 needs transcripts recorded after the skill rewrite."
  - "The description budget of an action (280 tokens) does not measure its schema text. describe returns the output schema twice, and the describe response has a budget of its own (8000 tokens) that a registry test measures. An earlier commit moved text into the settle output schema and said that no budget measures it."
  - "The status of a claim is not the status of a task. A claim that reports failed, blocked or skipped writes no task.failed row and leaves tasks[].status alone. The task is unresolved on the receipt and on the execution.settled row, and nowhere else on the stream."
  - "A reserved completion row is not a proven gate run. A guard on the writer of a fact proves nothing when the writer reads a forgeable input: task_complete accepted a gate.executed row that the generic append could write (#1886), until gate.executed was reserved too. The same holds for a field. The transition guards and the prepare frontier read tasks[].status, which exarchos_workflow update and a generic state.patched append write with no gate."
  - "A rationale is not a deviation and not evidence. It names a delegated decision of the capsule, it takes no decision round, and it changes no gate. A choice outside the delegated decisions goes in deviations."
  - "degraded: true on a static-analysis result is not a degraded verdict. An inconclusive run (skipReason constituent-skipped) has it too, as in earlier builds. completeness: 'degraded' marks a verdict that leaves out an advisory check with no verdict, and the gate.executed details and the settle trace carry that mark."
