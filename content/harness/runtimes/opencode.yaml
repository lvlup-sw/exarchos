# OpenCode CLI runtime map.
#
# OpenCode is a Claude-Code-compatible runtime. It exposes a `Task` tool
# with the same argument shape as Claude (subagent_type + prompt), and
# slash-command autoloading from the user config dir. It supports lifecycle
# hooks via TypeScript plugins (events `session.created` / `session.idle`),
# but those plugins are react-only and CANNOT inject context — so the
# `hooks` descriptor is `opencode-plugin` with `canInjectContext: false`
# (the Exarchos binding rides on AGENTS.md). It does NOT expose the
# skill-chaining `Skill` tool, so `CHAIN` falls back to a prose directive
# the same way `generic.yaml` does.
#
# Skills install globally under `~/.config/opencode/skills/` (per the
# OpenCode global config convention), unlike Claude which uses
# `~/.claude/skills/`. OpenCode tools appear under the bare MCP prefix
# `mcp__exarchos__` because OpenCode does not wrap MCP servers in a plugin
# namespace.
#
# Implements: DR-4, DR-5, OQ-3
name: opencode
# preferredFacade: cli — OpenCode's MCP client surface is still thin, so
# bash-style CLI invocations are the more reliable default.
# See documentation/facade-and-deployment.md for facade selection rationale.
preferredFacade: cli
capabilities:
  hasSubagents: true
  hasSlashCommands: true
  hooks:
    profile: opencode-plugin
    canInjectContext: false
    sessionStartEvent: session.created
    sessionEndEvent: session.idle
  hasSkillChaining: false
  mcpPrefix: "mcp__exarchos__"
  # OpenCode autoloads bare canonical-name slash commands from
  # `~/.config/opencode/commands/<name>.md` (global) / `.opencode/commands/`
  # (project). It is the ONLY runtime this cycle that can take a clean
  # canonical alias (`/ideate`, `/plan`, ...) — codex's custom prompts are
  # deprecated + namespaced (`/prompts:ideate`), copilot CLI has no autoload,
  # and cursor/generic expose no command surface. The skills build keys
  # alias emission off this declared capability, not an "opencode" literal
  # (INV-4). See docs/designs/2026-05-31-cross-harness-canonical-names-plan.md.
  canonicalCommandAliases: true
# Fine-grained support matrix consumed by the prose renderer (Tasks 8/9)
# to gate `<!-- requires:* -->` and `<!-- requires:native:* -->` blocks.
# Mirrors `OpenCodeAdapter.supportLevels` in
# `src/runtime/agents/adapters/opencode.ts` (a capability-support
# signal for the prose renderer, not a space or write guarantee). OpenCode
# covers fs/shell/subagent-spawn/MCP natively, treats `isolation:worktree` and
# `session:resume` as advisory (launcher-managed lifecycle, no first-class
# primitive), and rejects Claude-only signal hooks and Agent Teams —
# those are absent from this map by contract (`unsupported` capabilities
# are omitted entirely so the renderer can distinguish "any support"
# from "native only").
supportedCapabilities:
  fs:read: native
  fs:write: native
  shell:exec: native
  subagent:spawn: native
  mcp:exarchos: native
  mcp:exarchos:readonly: native
  # isolation:worktree — launcher-managed lifecycle (DR-1/DR-3): `exarchos
  # <harness>` owns this harness process and its top-level worktree lifecycle
  # (create → place → observe → teardown). A lifecycle relationship, not a
  # filesystem write guarantee — the launcher composes with whatever isolation
  # the harness provides itself and makes no space or write claim.
  isolation:worktree: advisory
  session:resume: advisory
skillsInstallPath: "~/.config/opencode/skills"
# Directory OpenCode autoloads bare canonical-name slash-command aliases from
# (global config dir). install-skills copies the generated
# `command-aliases/opencode/*.md` tree here after installing skills
# (T3, #1471/#1472). Only set on runtimes that declare
# `capabilities.canonicalCommandAliases` — the install gate keys off this
# field + the source tree, never an "opencode" literal (INV-4).
commandsInstallPath: "~/.config/opencode/commands"
detection:
  binaries:
    - opencode
  envVars: []
placeholders:
  MCP_PREFIX: "mcp__exarchos__"
  COMMAND_PREFIX: "/"
  TASK_TOOL: "Task"
  CHAIN: "[Invoke the exarchos:{{next}} skill with args: {{args}}]"
  # SPAWN_AGENT_CALL must reference the bare on-disk agent name written
  # by `OpenCodeAdapter.lowerSpec` (`.opencode/agents/<id>.md`). OpenCode
  # has no plugin-prefix namespace, so the legacy `exarchos-implementer`
  # token used previously was a broken pointer — there is no agent file
  # of that name on disk. Fixed under delegation runtime parity Task 7c
  # (discovery §3). `{{agent}}` is filled in by the dispatcher with the
  # spec id (implementer | fixer | reviewer | scaffolder).
  SPAWN_AGENT_CALL: |
    Task({
      subagent_type: "{{agent}}",
      prompt: "{{prompt}}"
    })
  # Wave A (P4 prose layer) — OpenCode's `Task({...})` returns the
  # subagent's reply inline in the dispatching turn; there is no
  # separate completion hook and no poll API. Both tokens reflect the
  # same inline-reply model so the rendered prose is internally
  # consistent.
  SUBAGENT_COMPLETION_HOOK: "inline (no completion hook — Task() reply returns synchronously)"
  SUBAGENT_RESULT_API: "Task() reply (inline, no poll)"
