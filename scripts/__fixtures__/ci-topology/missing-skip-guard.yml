# Synthetic fixture (DR-2 self-test, direction b): `test-root` is in
# `ci-gate.needs`, is PATH-FILTERED (its `if:` references
# `needs.changes.outputs.root`), and DOES have an evaluate clause matched
# against failure|cancelled — but the evaluate script carries NO fail-closed
# skip-guard keyed on `changes.outputs.root` for a skipped `test-root`.
# Trips the SKIP-GUARD-COVERAGE assertion only.
name: CI Fixture - Missing Skip Guard
on: push

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
    steps:
      - run: echo noop

  test-root:
    name: Root Package
    needs: changes
    if: (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request') && needs.changes.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo noop

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, test-root]
    steps:
      - name: Evaluate results
        run: |
          if [[ "${{ needs.changes.result }}" =~ ^(failure|cancelled)$ ]]; then
            exit 1
          fi
          if [[ "${{ needs.test-root.result }}" =~ ^(failure|cancelled)$ ]]; then
            exit 1
          fi
          echo "no skip-guard for test-root here"
